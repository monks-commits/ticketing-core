<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VA A/B Experiment</title>
<style>
:root{--bg:#07172d;--card:#10284a;--line:#27476f;--text:#f8fafc;--muted:#a9bdd8;--accent:#2f8fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(760px,100%)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8ec5ff;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.32)}
h1{font-size:38px;line-height:1.08;margin:0 0 18px}.copy{font-size:18px;line-height:1.55;color:#d7e5f6;white-space:pre-wrap}
.cta{display:inline-flex;margin-top:26px;border:0;border-radius:14px;padding:15px 20px;font-size:17px;font-weight:800;background:var(--accent);color:#fff;cursor:pointer}
.micro{font-size:11px;color:var(--muted);margin-top:18px}.error{background:#3a1520;border:1px solid #7f1d1d;padding:16px;border-radius:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Ваш Адмін • A/B experiment</div>
  <div class="card">
    <div id="error" class="error" hidden></div>
    <h1 id="headline">Подія</h1>
    <div id="copy" class="copy"></div>
    <button id="cta" class="cta">Обрати місця</button>
    <div class="micro">Варіант визначається випадково один раз для цього браузера в межах конкретного експерименту.</div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const qs = new URLSearchParams(location.search);
  const experimentId = String(qs.get("experiment_id") || "").trim();
  const seanceId = String(qs.get("seance_id") || qs.get("seance") || "").trim();
  const splitA = Math.min(95, Math.max(5, Number(qs.get("split_a") || 50)));
  const ASSIGN_PREFIX = "va_ab_assignment_v1:";
  const SESSION_KEY = "va_ab_experiment_v1";

  function getLocal(k){try{return localStorage.getItem(k)||""}catch(_){return""}}
  function setLocal(k,v){try{localStorage.setItem(k,v)}catch(_){}}
  function setSession(k,v){try{sessionStorage.setItem(k,v)}catch(_){}}

  function chooseVariant(){
    if(!experimentId) return "";
    const key=ASSIGN_PREFIX+experimentId;
    const existing=String(getLocal(key)||"").toUpperCase();
    if(existing==="A"||existing==="B") return existing;
    const rnd=crypto?.getRandomValues
      ? crypto.getRandomValues(new Uint32Array(1))[0]/4294967296
      : Math.random();
    const variant=rnd<(splitA/100)?"A":"B";
    setLocal(key,variant);
    return variant;
  }

  const variant=chooseVariant();

  if(!experimentId||!variant){
    const err=document.getElementById("error");
    err.hidden=false;
    err.textContent="Посилання експерименту неповне.";
    document.getElementById("cta").disabled=true;
    return;
  }

  setSession(SESSION_KEY,JSON.stringify({
    experiment_id:experimentId,
    variant,
    seance_id:seanceId||null,
    assigned_at:new Date().toISOString()
  }));

  const head=String(qs.get(variant==="A"?"a_head":"b_head")||"Подія");
  const body=String(qs.get(variant==="A"?"a_text":"b_text")||"");
  const cta=String(qs.get(variant==="A"?"a_cta":"b_cta")||"Обрати місця");

  document.getElementById("headline").textContent=head;
  document.getElementById("copy").textContent=body;
  document.getElementById("cta").textContent=cta;

  document.getElementById("cta").addEventListener("click",()=>{
    let target=String(qs.get("target")||"./hall.html");
    try{
      const u=new URL(target,location.href);
      if(seanceId&&!u.searchParams.get("seance"))u.searchParams.set("seance",seanceId);
      u.searchParams.set("experiment_id",experimentId);
      u.searchParams.set("ab_variant",variant);

      for(const key of ["campaign_id","ref","utm_source","utm_medium","utm_campaign","title","show","source","venue"]){
        const value=qs.get(key);
        if(value&&!u.searchParams.get(key))u.searchParams.set(key,value);
      }
      location.href=u.toString();
    }catch(e){location.href=target}
  });
})();
</script>
<script src="../../shared/va-cro-tracker.js"></script>
<script>
if(window.VACRO){
  window.VACRO.track("experiment_exposure",{
    page_code:"experiment-entry",
    seance_id:new URLSearchParams(location.search).get("seance_id")||null,
    metadata:{randomized:true}
  }).catch(()=>{});
}
</script>
</body>
</html>
