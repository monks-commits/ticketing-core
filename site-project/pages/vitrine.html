<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Афіша — Ваш Адмін</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#061a3a;--card:#fff;--text:#111827;--muted:#64748b;--line:#e5e7eb;--blue:#2563eb;--blue2:#1d4ed8;--soft:#f1f5f9;--shadow:0 18px 44px rgba(0,0,0,.18)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(37,99,235,.30),transparent 34%),var(--bg)}
.page{width:min(1180px,calc(100% - 36px));margin:0 auto}
.hero{color:#fff;padding:34px 0 26px}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:30px}
.logo{font-size:24px;font-weight:900}.partner-link{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;font-weight:800;border:1px solid rgba(255,255,255,.18)}
.hero h1{margin:0 0 10px;font-size:52px;line-height:1.05;max-width:900px}.hero p{margin:0;color:#dbeafe;font-size:18px;line-height:1.45;max-width:760px}
.filters{margin-top:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:14px;display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:10px}
select,input{min-height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:#fff;color:#111827;padding:0 12px;outline:none;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border:0;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.btn:hover{background:var(--blue2)}
.main{background:#f8fafc;min-height:60vh;padding:28px 0 54px;border-top-left-radius:28px;border-top-right-radius:28px}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.summary h2{margin:0;font-size:28px}.summary .meta{color:var(--muted);font-size:14px}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:100%}
.poster{height:330px;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:900;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}.title{font-size:21px;font-weight:900;line-height:1.18}.info{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:14px;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:6px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--soft);color:#334155;font-size:12px;font-weight:800}.badge.green{background:#dcfce7;color:#166534}
.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:auto}.empty,.error{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:22px;padding:34px;text-align:center;color:var(--muted);font-size:16px}.error{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.footer{color:#cbd5e1;padding:28px 0;font-size:13px}
@media(max-width:1000px){.events{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.page{width:min(100% - 24px,1180px)}.topline{align-items:flex-start;flex-direction:column}.hero h1{font-size:36px}.hero p{font-size:16px}.filters{grid-template-columns:1fr}.events{grid-template-columns:1fr}.poster{height:270px}.summary{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="hero"><div class="page">
<div class="topline"><div class="logo">Ваш Адмін • Афіша</div><a class="partner-link" href="../admin/partner-login.html">Вхід для партнерів</a></div>
<h1>Квитки на події у вашому місті</h1>
<p>Оберіть місто, майданчик або подію. Афіша формується автоматично з активних сеансів VA Platform.</p>
<div class="filters">
<select id="citySelect"><option value="">Усі міста</option><option value="kryvyi-rih">Кривий Ріг</option><option value="dnipro">Дніпро</option></select>
<select id="venueSelect"><option value="">Усі майданчики</option></select>
<input id="searchInput" placeholder="Пошук за назвою події">
<button class="btn" id="applyBtn">Показати</button>
</div></div></header>
<main class="main"><div class="page">
<div class="summary"><div><h2>Найближчі події</h2><div class="meta" id="summaryMeta">Завантаження…</div></div></div>
<section class="events" id="eventsList"><div class="empty">Завантаження афіші…</div></section>
</div></main>
<footer class="footer"><div class="page">VA Platform — онлайн-продаж квитків, QR-контроль, звіти та гібридна каса.</div></footer>
<script>
"use strict";
const SUPABASE_URL="https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";
const citySelect=document.getElementById("citySelect"),venueSelect=document.getElementById("venueSelect"),searchInput=document.getElementById("searchInput"),eventsList=document.getElementById("eventsList"),summaryMeta=document.getElementById("summaryMeta");
const qs=new URLSearchParams(location.search);
const CITIES={"kryvyi-rih":"Кривий Ріг","dnipro":"Дніпро"};
const VENUES={"shevchenko":{title:"Театр Шевченка",city_id:"kryvyi-rih"},"academy":{title:"Академія Руху",city_id:"kryvyi-rih"},"opera-test":{title:"Оперний театр",city_id:"dnipro"},"big-stage-demo":{title:"Велика сцена Demo",city_id:"dnipro"}};
function dbVenueToPublicVenue(v){if(v==="shevchenko-v2")return"shevchenko";return v||""}
function venueTitle(v){return VENUES[v]?.title||v||"Майданчик"}
function cityTitle(c){return CITIES[c]||c||"Місто"}
function fillVenues(){const city=citySelect.value;const entries=Object.entries(VENUES).filter(([,v])=>!city||v.city_id===city);venueSelect.innerHTML='<option value="">Усі майданчики</option>'+entries.map(([id,v])=>'<option value="'+id+'">'+v.title+'</option>').join("");const urlVenue=qs.get("venue");if(urlVenue&&VENUES[urlVenue])venueSelect.value=urlVenue}
function applyUrlParams(){const city=qs.get("city")||"",venue=qs.get("venue")||"",q=qs.get("q")||"";if(city&&CITIES[city])citySelect.value=city;fillVenues();if(venue&&VENUES[venue])venueSelect.value=venue;if(q)searchInput.value=q}
function updateUrl(){const p=new URLSearchParams();if(citySelect.value)p.set("city",citySelect.value);if(venueSelect.value)p.set("venue",venueSelect.value);if(searchInput.value.trim())p.set("q",searchInput.value.trim());history.replaceState(null,"","vitrine.html"+(p.toString()?"?"+p.toString():""))}
function isFutureOrToday(date){if(!date)return true;return String(date)>=new Date().toISOString().slice(0,10)}
function hallUrl(seanceId){return "./hall.html?seance="+encodeURIComponent(seanceId)}
function eventMatches(row){const city=citySelect.value,venue=venueSelect.value,q=searchInput.value.trim().toLowerCase();const rowVenue=dbVenueToPublicVenue(row.venue_id);const rowCity=VENUES[rowVenue]?.city_id||"";if(city&&rowCity!==city)return false;if(venue&&rowVenue!==venue)return false;if(q){const text=[row.show,row.id,venueTitle(rowVenue),cityTitle(rowCity)].join(" ").toLowerCase();if(!text.includes(q))return false}return true}
function formatDate(date,time){if(!date&&!time)return"Дата уточнюється";return[date,time].filter(Boolean).join(" • ")}
function safe(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function renderEvents(rows){let list=rows.filter(r=>r.active!==false).filter(r=>isFutureOrToday(r.date)).filter(eventMatches).sort((a,b)=>((a.date||"9999-99-99")+" "+(a.time||"99:99")).localeCompare((b.date||"9999-99-99")+" "+(b.time||"99:99")));summaryMeta.textContent=list.length?"Знайдено подій: "+list.length:"За цими фільтрами подій немає";if(!list.length){eventsList.innerHTML='<div class="empty">Подій не знайдено. Змініть місто, майданчик або пошук.</div>';return}eventsList.innerHTML=list.map(row=>{const rowVenue=dbVenueToPublicVenue(row.venue_id),city=VENUES[rowVenue]?.city_id||"",title=row.show||row.id,poster=row.poster_url||"";return '<article class="card"><div class="poster">'+(poster?'<img src="'+safe(poster)+'" alt="'+safe(title)+'">':'<span>Без афіші</span>')+'</div><div class="body"><div class="title">'+safe(title)+'</div><div class="info"><div><b>Коли:</b> '+safe(formatDate(row.date,row.time))+'</div><div><b>Де:</b> '+safe(venueTitle(rowVenue))+'</div><div><b>Місто:</b> '+safe(cityTitle(city))+'</div></div><div class="badges"><span class="badge green">квитки онлайн</span><span class="badge">'+safe(venueTitle(rowVenue))+'</span></div><div class="actions"><a class="btn" href="'+hallUrl(row.id)+'">Купити квиток</a></div></div></article>'}).join("")}
async function loadEvents(){eventsList.innerHTML='<div class="empty">Завантаження афіші…</div>';summaryMeta.textContent="Завантаження…";try{const url=SUPABASE_URL+"/rest/v1/seances?select=id,show,date,time,poster_url,venue_id,active,created_at&active=eq.true&order=date.asc,time.asc";const res=await fetch(url,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY},cache:"no-store"});if(!res.ok)throw new Error(await res.text());const rows=await res.json();renderEvents(Array.isArray(rows)?rows:[])}catch(e){eventsList.innerHTML='<div class="error">Помилка завантаження афіші.<br>'+safe(e.message||e)+'</div>';summaryMeta.textContent="Помилка"}}
document.getElementById("applyBtn").addEventListener("click",()=>{updateUrl();loadEvents()});
citySelect.addEventListener("change",()=>{fillVenues();updateUrl();loadEvents()});
venueSelect.addEventListener("change",()=>{updateUrl();loadEvents()});
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter"){updateUrl();loadEvents()}});
applyUrlParams();loadEvents();
</script>
</body>
</html>
