<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VA Campaign</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#081a2f;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
    .box{max-width:560px;padding:28px;border:1px solid rgba(255,255,255,.15);border-radius:20px;background:#10243f;text-align:center}
    .muted{color:#9fb3cf;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <h1>Ваш Адмін</h1>
    <div id="msg" class="muted">Відкриваємо продаж…</div>
  </div>
<script>
(() => {
  "use strict";

  const MARKETING_KEY = "va_marketing_attribution_v1";
  const CRO_SESSION_KEY = "va_cro_session_id_v1";
  const CRO_SOURCE_KEY = "va_cro_source_v1";
  const CRO_TOUCH_KEY = "va_cro_source_touch_sent_v1";

  const qs = new URLSearchParams(location.search);
  const campaignId = String(qs.get("campaign_id") || "").trim();
  const seanceId = String(qs.get("seance_id") || qs.get("seance") || "").trim();
  const utmSource = String(qs.get("utm_source") || "va").trim().slice(0,120);
  const utmMedium = String(qs.get("utm_medium") || "campaign").trim().slice(0,120);
  const utmCampaign = String(qs.get("utm_campaign") || campaignId).trim().slice(0,160);

  if(!campaignId || !campaignId.startsWith("VAC-") || !seanceId){
    document.getElementById("msg").textContent = "Посилання кампанії неповне.";
    return;
  }

  const ctx = {
    campaign_id: campaignId.slice(0,160),
    seance_id: seanceId.slice(0,200),
    utm_source: utmSource,
    utm_medium: utmMedium,
    utm_campaign: utmCampaign,
    captured_at: new Date().toISOString()
  };

  try{
    sessionStorage.setItem(MARKETING_KEY, JSON.stringify(ctx));

    // Every explicit campaign entry starts a fresh CRO acquisition journey.
    // visitor_id remains untouched, so the same visitor can still be recognized
    // anonymously across sessions while attribution stays clean.
    sessionStorage.removeItem(CRO_SESSION_KEY);
    sessionStorage.removeItem(CRO_SOURCE_KEY);
    sessionStorage.removeItem(CRO_TOUCH_KEY);
  }catch(e){}

  const hall = new URL("./hall.html", location.href);
  hall.searchParams.set("seance", seanceId);

  // Carry attribution explicitly as well as through sessionStorage.
  // This makes Hall/CRO resilient even if an older source context existed.
  hall.searchParams.set("campaign_id", campaignId);
  hall.searchParams.set("utm_source", utmSource);
  hall.searchParams.set("utm_medium", utmMedium);
  hall.searchParams.set("utm_campaign", utmCampaign);

  const ref = String(qs.get("ref") || "").trim();
  if(ref) hall.searchParams.set("ref", ref);

  // Preserve A/B context when a campaign link is intentionally combined
  // with an experiment.
  for(const key of ["experiment_id","exp_id","ab_variant","variant"]){
    const value = String(qs.get(key) || "").trim();
    if(value) hall.searchParams.set(key, value);
  }

  location.replace(hall.toString());
})();
</script>
</body>
</html>
