<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VA Director — Сеанси</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d1728;
      color: #fff;
    }

    .topbar {
      height: 72px;
      background: #0b1222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar h1 {
      font-size: 28px;
      font-weight: 900;
    }

    .back {
      background: #5b0d16;
      color: #fff;
      border: 0;
      border-radius: 16px;
      padding: 13px 22px;
      font-weight: 900;
      cursor: pointer;
    }

    .wrap {
      min-height: calc(100vh - 72px);
      padding: 26px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    .panel {
      background: #1d2a3d;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow: hidden;
    }

    .panel-head {
      padding: 24px;
      font-size: 26px;
      font-weight: 900;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .status-list { padding: 18px; }

    .status-btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px 18px;
      margin-bottom: 13px;
      background: #26364f;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-btn.active { background: #5b0d16; }

    .content {
      padding: 26px;
      overflow: auto;
      height: 100%;
    }

    .content-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 24px;
    }

    .seance-list {
      display: grid;
      gap: 14px;
    }

    .seance-row {
      background: #121d32;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 18px 20px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 150px 1fr 180px;
      gap: 18px;
      align-items: center;
    }

    .seance-row:hover {
      border-color: #8b1a28;
      box-shadow: 0 10px 30px rgba(139,26,40,.28);
    }

    .date {
      color: #f0c36a;
      font-weight: 900;
      font-size: 18px;
    }

    .name {
      font-weight: 900;
      font-size: 21px;
    }

    .small {
      color: #aeb9ca;
      margin-top: 5px;
      font-size: 14px;
    }

    .badge {
      background: #26364f;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty, .error {
      background: #121d32;
      border-radius: 18px;
      padding: 22px;
      color: #c4cede;
      line-height: 1.45;
    }

    .error { color: #ffb4b4; }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>VA Director — Сеанси</h1>
    <button class="back" onclick="location.href='./director-dashboard.html'">← Головна</button>
  </header>

  <main class="wrap">
    <aside class="panel">
      <div class="panel-head">Розділи</div>

      <div class="status-list">
       <button class="status-btn active" data-status="sale">
  В продажі <b id="count-sale">0</b>
</button>
         <button class="status-btn" data-status="done">Відбулися <b id="count-done">0</b></button>
        <button class="status-btn" data-status="postponed">Перенесені <b id="count-postponed">0</b></button>
        <button class="status-btn" data-status="cancelled">Скасовані <b id="count-cancelled">0</b></button>
        <button class="status-btn" data-status="archive">Архів <b id="count-archive">0</b></button>
      </div>
    </aside>

    <section class="panel">
      <div class="content">
        <div class="content-title" id="content-title">В продажі</div>
        <div class="seance-list" id="seance-list">Завантаження...</div>
      </div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

    const vaDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allSeances = [];
    let recoveryEvents = [];
    let activeStatus = "sale";

   const sections = [
  { key: "sale", label: "В продажі" },
  { key: "done", label: "Відбулися" },
  { key: "postponed", label: "Перенесені" },
  { key: "cancelled", label: "Скасовані" },
  { key: "archive", label: "Архів" }
];

const titles = {
  sale: "В продажі",
  done: "Відбулися",
  postponed: "Перенесені",
  cancelled: "Скасовані",
  archive: "Архів"
};

    function getStartAt(s) {
  if (s.date && s.time) {
    return `${s.date}T${s.time}:00`;
  }

  return (
    s.starts_at ||
    s.start_at ||
    s.datetime ||
    s.date_time ||
    s.date ||
    null
  );
}

function getTitle(s) {
  return (
    s.show ||
    s.title ||
    s.name ||
    s.code ||
    s.id ||
    "Без названия"
  );
}

function getHall(s) {
  return (
    s.venue_id ||
    s.hall ||
    s.hall_name ||
    s.venue ||
    ""
  );
}
    function classifySeance(s) {
  const rawStatus = String(s.status || "").toLowerCase();

  if (rawStatus === "postponed") return "postponed";
  if (rawStatus === "cancelled" || rawStatus === "canceled") return "cancelled";
  if (rawStatus === "archive" || rawStatus === "archived" || s.archived === true) return "archive";

  const startRaw = getStartAt(s);

  if (!startRaw) return "sale";

  const now = new Date();
  const start = new Date(startRaw);

  if (Number.isNaN(start.getTime())) return "sale";

  const durationHours = Number(s.duration_hours || 4);
  const end = new Date(start.getTime() + durationHours * 60 * 60 * 1000);

  if (now <= end) return "sale";

  return "done";
}

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "—";

      return d.toLocaleDateString("ru-RU", {
        day: "2-digit",
        month: "2-digit"
      }) + " " + d.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    async function loadSeances() {
  const list = document.getElementById("seance-list");

  const seancesReq = vaDb
    .from("seances")
    .select("*");

  const recoveryReq = vaDb
    .from("recovery_events")
    .select("*")
    .order("created_at", { ascending: false });

  const [
    { data: seances, error: seancesError },
    { data: recovery, error: recoveryError }
  ] = await Promise.all([seancesReq, recoveryReq]);

  if (seancesError) {
    list.innerHTML = `<div class="error">Помилка завантаження seances:<br>${seancesError.message}</div>`;
    console.error(seancesError);
    return;
  }

  if (recoveryError) {
    list.innerHTML = `<div class="error">Помилка завантаження recovery_events:<br>${recoveryError.message}</div>`;
    console.error(recoveryError);
    return;
  }

  allSeances = (seances || [])
    .map(s => ({
      ...s,
      director_status: classifySeance(s)
    }))
    .sort((a, b) => {
      const da = new Date(getStartAt(a) || 0).getTime();
      const db = new Date(getStartAt(b) || 0).getTime();
      return da - db;
    });

  recoveryEvents = (recovery || []).filter(e => {
    const type = String(e.incident_type || "").toLowerCase();
    return type === "postponed";
  });

  updateCounts();
  renderList();
}
    function updateCounts() {
      Object.keys(titles).forEach(key => {
        const el = document.getElementById("count-" + key);
        if (!el) return;
        el.textContent = allSeances.filter(s => s.director_status === key).length;
      });
    }

    function renderList() {
      document.getElementById("content-title").textContent = titles[activeStatus];

      const list = document.getElementById("seance-list");
      const rows = allSeances.filter(s => s.director_status === activeStatus);

      if (!rows.length) {
        list.innerHTML = `<div class="empty">Сеансів у цьому розділі немає.</div>`;
        return;
      }

      list.innerHTML = rows.map(s => {
        const id = String(s.id);
        return `
          <div class="seance-row" onclick="openSeance('${id}')">
            <div class="date">${formatDate(getStartAt(s))}</div>
            <div>
              <div class="name">${getTitle(s)}</div>
              <div class="small">${getHall(s)}</div>
            </div>
            <div class="badge">${s.code || id}</div>
          </div>
        `;
      }).join("");
    }

  function openSeance(id) {
  location.href =
    `/ticketing-core/hybrid/hall-cash.html?show=&seance=${encodeURIComponent(id)}&director=1&mode=${encodeURIComponent(activeStatus)}`;
}

    document.querySelectorAll(".status-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".status-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeStatus = btn.dataset.status;
        renderList();
      });
    });

    loadSeances();
  </script>
</body>
</html>
