<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Картотека глядачів — VA Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#061a3a;
  color:#fff;
}

.wrap{
  width:min(1200px,calc(100% - 40px));
  margin:0 auto;
  padding:40px 0;
}

.card{
  background:#1d2d47;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.22);
}

h1{
  font-size:46px;
  margin:0 0 12px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:#10233f;
  color:#fff;
  font:inherit;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
  background:#4c86f7;
  color:#fff;
}

.btn-green{
  background:#2ecc71;
  color:#08111f;
}

.row{
  background:#223552;
  border-radius:16px;
  padding:16px;
  margin-top:12px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
}

.muted{
  color:#b8c4d6;
  font-size:14px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#f5b400;
  color:#111;
  font-size:12px;
  font-weight:800;
  margin-right:6px;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<div class="wrap">

  <h1>👤 Картотека глядачів</h1>

  <div class="card">
    <input id="search" placeholder="Пошук: імʼя, телефон, email, Telegram">
    <br><br>
    <button class="btn" onclick="loadViewers()">Пошук</button>
    <button class="btn btn-green" onclick="showCreate()">+ Додати глядача</button>
  </div>

  <div id="form" class="card" style="display:none;">
    <h2>Картка глядача</h2>

    <div class="grid">
      <input id="full_name" placeholder="ПІБ">
      <input id="phone" placeholder="Телефон">
      <input id="email" placeholder="Email">
      <input id="telegram" placeholder="Telegram">
      <input id="city" placeholder="Місто">
      <input id="birthday" type="date">
    </div>

    <br>

    <textarea id="notes" placeholder="Нотатки" rows="4"></textarea>

    <br><br>

    <button class="btn btn-green" onclick="saveViewer()">Зберегти</button>
  </div>

  <div id="list"></div>

</div>

<script>
const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

let currentViewerId = null;

function headers(){
  return {
    apikey: SUPABASE_KEY,
    Authorization: "Bearer " + SUPABASE_KEY,
    "Content-Type":"application/json"
  };
}

function showCreate(){
  currentViewerId = null;
  document.getElementById("form").style.display = "block";

  ["full_name","phone","email","telegram","city","birthday","notes"]
    .forEach(id => document.getElementById(id).value = "");
}

async function loadViewers(){
  const q = document.getElementById("search").value.trim();

  let url =
    `${SUPABASE_URL}/rest/v1/viewers?select=*&order=created_at.desc&limit=50`;

  if (q) {
    const v = encodeURIComponent(`%${q}%`);
    url =
      `${SUPABASE_URL}/rest/v1/viewers?select=*&or=(full_name.ilike.${v},phone.ilike.${v},email.ilike.${v},telegram.ilike.${v})&order=created_at.desc&limit=50`;
  }

  const res = await fetch(url, { headers: headers(), cache:"no-store" });
  const rows = await res.json();

  renderList(Array.isArray(rows) ? rows : []);
}

function renderList(rows){
  const box = document.getElementById("list");

  if (!rows.length) {
    box.innerHTML = `<div class="card muted">Глядачів не знайдено.</div>`;
    return;
  }

  box.innerHTML = rows.map(v => `
    <div class="row">
      <div>
        <div style="font-size:22px;font-weight:800;">
          ${v.full_name || "Без імені"}
        </div>

        <div class="muted">
          ${v.phone || "—"} · ${v.email || "—"} · ${v.telegram || "—"}
        </div>

        <div style="margin-top:10px;">
          <span class="badge">${v.loyalty_level || "new"}</span>
          <span class="badge">Візитів: ${v.total_visits || 0}</span>
          <span class="badge">Квитків: ${v.total_tickets || 0}</span>
        </div>
      </div>

      <div>
        <button class="btn" onclick="openViewer('${v.id}')">Відкрити</button>
      </div>
    </div>
  `).join("");
}

async function openViewer(id){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/viewers?id=eq.${encodeURIComponent(id)}&select=*`,
    { headers: headers(), cache:"no-store" }
  );

  const rows = await res.json();
  const v = rows[0];
  if (!v) return;

  currentViewerId = v.id;

  document.getElementById("form").style.display = "block";

  document.getElementById("full_name").value = v.full_name || "";
  document.getElementById("phone").value = v.phone || "";
  document.getElementById("email").value = v.email || "";
  document.getElementById("telegram").value = v.telegram || "";
  document.getElementById("city").value = v.city || "";
  document.getElementById("birthday").value = v.birthday || "";
  document.getElementById("notes").value = v.notes || "";

  loadViewerEvents(id);
}

async function saveViewer(){
  const data = {
    full_name: document.getElementById("full_name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    email: document.getElementById("email").value.trim(),
    telegram: document.getElementById("telegram").value.trim(),
    city: document.getElementById("city").value.trim(),
    birthday: document.getElementById("birthday").value || null,
    notes: document.getElementById("notes").value.trim(),
    updated_at: new Date().toISOString()
  };

  let url = `${SUPABASE_URL}/rest/v1/viewers`;
  let method = "POST";

  if (currentViewerId) {
    url += `?id=eq.${encodeURIComponent(currentViewerId)}`;
    method = "PATCH";
  }

  const res = await fetch(url, {
    method,
    headers: {
      ...headers(),
      Prefer:"return=representation"
    },
    body: JSON.stringify(data)
  });

  if (!res.ok) {
    alert("Помилка збереження");
    console.error(await res.text());
    return;
  }

  alert("Збережено");
  loadViewers();
}

async function loadViewerEvents(viewerId){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/viewer_events?viewer_id=eq.${encodeURIComponent(viewerId)}&select=*&order=created_at.desc&limit=30`,
    { headers: headers(), cache:"no-store" }
  );

  const rows = await res.json();

  const form = document.getElementById("form");

  let old = document.getElementById("viewer-history");
  if (old) old.remove();

  const div = document.createElement("div");
  div.id = "viewer-history";
  div.innerHTML = `
    <h3>Історія</h3>
    ${
      Array.isArray(rows) && rows.length
        ? rows.map(e => `
            <div class="row" style="grid-template-columns:1fr;">
              <b>${e.event_type}</b>
              <div class="muted">
                ${new Date(e.created_at).toLocaleString()}
                · ${e.seance_id || ""}
                · ${e.seat_label || ""}
              </div>
            </div>
          `).join("")
        : `<div class="muted">Історії поки немає.</div>`
    }
  `;

  form.appendChild(div);
}

loadViewers();
</script>
</body>
</html>
