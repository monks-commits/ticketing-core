<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VA • Перехід до Квиткового відділу</title>
  <style>body{margin:0;background:#0b0f18;color:#fff;font:16px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:680px;padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:#1d2d47}.box a{color:#fff}</style>
</head>
<body>
  <div class="box">Керування сеансами перенесено до <b>Квиткового відділу</b>. Виконується перехід…</div>
  <script>
    (function(){
      const target = "./ticket-office.html" + location.search + location.hash;
      location.replace(target);
      setTimeout(()=>{document.querySelector('.box').innerHTML=`Керування сеансами знаходиться у <a href="${target}">Квитковому відділі</a>.`;},900);
    })();
  </script>
</body>
</html>
