<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VA Director Dashboard</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:Arial, Helvetica, sans-serif;
      background:#0d1728;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .dashboard{
      width:min(880px, 100%);
      background:#1d2a3d;
      border:1px solid rgba(255,255,255,.12);
      border-radius:28px;
      padding:70px 40px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    h1{
      font-size:46px;
      line-height:1.1;
      margin-bottom:20px;
      font-weight:900;
      letter-spacing:.02em;
    }

    .subtitle{
      font-size:22px;
      color:#c8d0dd;
      margin-bottom:54px;
    }

    .director-actions{
      width:min(520px, 100%);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .director-btn{
      width:100%;
      min-height:74px;
      border:0;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      color:#fff;
      font-size:27px;
      font-weight:900;
      letter-spacing:.03em;
      text-transform:uppercase;
      cursor:pointer;
      box-shadow:0 14px 34px rgba(0,0,0,.24);
      transition:.15s ease;
    }

    .director-btn:hover{
      filter:brightness(1.08);
      transform:translateY(-1px);
    }

    .director-btn.red{
      background:#7f0f1a;
    }

    .director-btn.blue{
      background:#2563eb;
    }

    .director-btn.yellow{
      background:#f5b400;
      color:#111827;
    }

    .director-btn.green{
      background:#22c55e;
      color:#07111f;
    }

    .version{
      margin-top:46px;
      color:#7fa0d8;
      font-size:16px;
    }

    @media(max-width:640px){
      body{
        padding:18px;
      }

      .dashboard{
        padding:44px 20px;
        border-radius:22px;
      }

      h1{
        font-size:34px;
      }

      .subtitle{
        font-size:18px;
        margin-bottom:36px;
      }

      .director-btn{
        min-height:66px;
        font-size:21px;
      }
    }
  </style>
</head>

<body>

  <main class="dashboard">
    <h1>VA Director Dashboard</h1>

    <div class="subtitle">
      Директорська ложа управління театром
    </div>

    <div class="director-actions">

      <button class="director-btn red" onclick="location.href='./director-seances.html#sale'">
        Сеанси
      </button>

      <button class="director-btn blue" onclick="location.href='./ticket-office.html'">
        Квитковий відділ
      </button>

      <button class="director-btn yellow" onclick="location.href='./compensation-cabinet.html'">
        Компенсації
      </button>

      <button class="director-btn green" onclick="location.href='./access-control.html'">
        Контроль доступу
      </button>

    </div>

    <div class="version">
      VA Director V1
    </div>
  </main>

</body>
</html>
