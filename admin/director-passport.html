<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VA Director — Паспорт сеансу</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d1728;
      color: #fff;
    }

    .topbar {
      height: 72px;
      background: #0b1222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar h1 {
      font-size: 28px;
      font-weight: 900;
    }

    .back {
      background: #5b0d16;
      color: #fff;
      border: 0;
      border-radius: 16px;
      padding: 12px 22px;
      font-weight: 900;
      cursor: pointer;
    }

    .passport-grid {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #1d2a3d;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.08);
      min-height: 220px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .card h2 {
      margin-bottom: 18px;
      font-size: 24px;
      font-weight: 900;
    }

    .line {
      margin-bottom: 9px;
      color: #c8d0dd;
      font-size: 16px;
      line-height: 1.4;
    }

    .line b {
      color: #fff;
    }

    .muted {
      color: #9fb0c8;
    }

    .error {
      color: #ffb4b4;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1 id="passport-title">Паспорт сеансу</h1>

    <button class="back" onclick="history.back()">
      ← Назад
    </button>
  </header>

  <main class="passport-grid">

    <section class="card" id="general-card">
      <h2>Загальне</h2>
      <div id="general-body" class="muted">Завантаження...</div>
    </section>

    <section class="card">
      <h2>Продажі</h2>
      <div id="sales-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Динаміка</h2>
      <div id="dynamic-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Канали</h2>
      <div id="channels-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Типи квитків</h2>
      <div id="types-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Відвідуваність</h2>
      <div id="attendance-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Аудиторія</h2>
      <div id="audience-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Компенсації</h2>
      <div id="recovery-body" class="muted">Готується...</div>
    </section>

    <section class="card">
      <h2>Порівняння</h2>
      <div id="compare-body" class="muted">Готується...</div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

    const vaDb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const params = new URLSearchParams(location.search);
    const seanceId = params.get("seance");

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fmt(value) {
      return value || "—";
    }

    async function boot() {
      if (!seanceId) {
        document.getElementById("general-body").innerHTML =
          `<div class="error">Не передано seance_id.</div>`;
        return;
      }

     await loadGeneral();

async function loadSales() {
  const { data: tickets, error } = await vaDb
    .from("tickets")
    .select("id, price, ticket_type, channel")
    .eq("seance_id", seanceId);

  if (error) {
    document.getElementById("sales-body").innerHTML =
      `<div class="error">${esc(error.message)}</div>`;
    return;
  }

  const sold = tickets?.length || 0;

  const amount = (tickets || [])
    .reduce((sum, t) => sum + Number(t.price || 0), 0);

  const avg = sold
    ? Math.round(amount / sold)
    : 0;

const { data: bookings } = await vaDb
  .from("bookings")
  .select("*")
  .eq("seance_id", seanceId);

const holds = (bookings || []).filter(
  b =>
    b.status === "hold" &&
    (!b.expires_at ||
      new Date(b.expires_at) > new Date())
);

const reserves = (bookings || []).filter(
  b =>
    b.status === "reserved"
);



const holdCount = holds.length;
const reserveCount = reserves.length;
const occupied = sold + reserveCount + holdCount;  
  
  document.getElementById("sales-body").innerHTML = `
    <div class="line"><b>Продано:</b> ${sold}</div>
    <div><b>Бронь:</b> ${reserveCount}</div>
<div><b>Холд:</b> ${holdCount}</div>
<div class="line"><b>Виручка:</b> ${amount.toLocaleString("uk-UA")} грн</div>
<div><b>Зайнято місць:</b> ${occupied}</div>
    <div class="line"><b>Середній чек:</b> ${avg.toLocaleString("uk-UA")} грн</div>
  `;
}
      
await loadSales();
    }

async function loadDynamic() {
  const { data: orders, error } = await vaDb
    .from("orders")
    .select("id, amount, created_at, status")
    .eq("seance_id", seanceId);

  if (error) {
    document.getElementById("dynamic-body").innerHTML =
      `<div class="error">${esc(error.message)}</div>`;
    return;
  }

  const paidOrders = (orders || []).filter(
    o => String(o.status || "").toLowerCase() === "paid"
  );

  const now = new Date();

  const todayKey = now.toISOString().slice(0, 10);

  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayKey = yesterday.toISOString().slice(0, 10);

  const last7 = new Date(now);
  last7.setDate(last7.getDate() - 7);

  let todayCount = 0;
  let yesterdayCount = 0;
  let last7Count = 0;
  let last7Amount = 0;

  const byDay = {};

  paidOrders.forEach(o => {
    if (!o.created_at) return;

    const d = new Date(o.created_at);
    if (Number.isNaN(d.getTime())) return;

    const key = d.toISOString().slice(0, 10);

    byDay[key] = (byDay[key] || 0) + 1;

    if (key === todayKey) todayCount++;
    if (key === yesterdayKey) yesterdayCount++;

    if (d >= last7) {
      last7Count++;
      last7Amount += Number(o.amount || 0);
    }
  });

  const bestDay = Object.entries(byDay)
    .sort((a, b) => b[1] - a[1])[0];

  document.getElementById("dynamic-body").innerHTML = `
    <div class="line"><b>Сьогодні:</b> ${todayCount}</div>
    <div class="line"><b>Вчора:</b> ${yesterdayCount}</div>
    <div class="line"><b>7 днів:</b> ${last7Count}</div>
    <div class="line"><b>Сума за 7 днів:</b> ${last7Amount.toLocaleString("uk-UA")} грн</div>
    <div class="line"><b>Кращий день:</b> ${
      bestDay ? `${bestDay[0]} · ${bestDay[1]}` : "—"
    }</div>
  `;
}
    
await loadDynamic();
}
    
    async function loadGeneral() {
      const { data, error } = await vaDb
        .from("seances")
        .select("*")
        .eq("id", seanceId)
        .single();

      if (error || !data) {
        document.getElementById("general-body").innerHTML =
          `<div class="error">Сеанс не знайдено.<br>${esc(error?.message || "")}</div>`;
        return;
      }

      document.getElementById("passport-title").textContent =
        data.show || "Паспорт сеансу";

      document.getElementById("general-body").innerHTML = `
        <div class="line"><b>ID:</b> ${esc(data.id)}</div>
        <div class="line"><b>Назва:</b> ${esc(fmt(data.show))}</div>
        <div class="line"><b>Дата:</b> ${esc(fmt(data.date))}</div>
        <div class="line"><b>Час:</b> ${esc(fmt(data.time))}</div>
        <div class="line"><b>Площадка:</b> ${esc(fmt(data.venue_id))}</div>
        <div class="line"><b>Жанр:</b> ${esc(fmt(data.genre))}</div>
        <div class="line"><b>Тип:</b> ${esc(fmt(data.event_type))}</div>
        <div class="line"><b>Статус:</b> ${esc(fmt(data.status))}</div>
        <div class="line"><b>Місткість:</b> ${esc(fmt(data.capacity))}</div>
      `;
    }

    boot();
  </script>
</body>
</html>
