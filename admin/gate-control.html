<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>VA • Вхідний контроль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg:#08111f;
      --card:#182842;
      --card2:#223653;
      --text:#fff;
      --muted:#b8c7dc;
      --line:rgba(255,255,255,.14);
      --green:#22c55e;
      --yellow:#f5b400;
      --red:#ef4444;
      --accent:#7f1d1d;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(127,29,29,.34), transparent 34%),
        radial-gradient(circle at top right, rgba(56,189,248,.16), transparent 30%),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      width:min(760px, calc(100% - 28px));
      margin:0 auto;
      padding:28px 0 42px;
    }

    .head{
      margin-bottom:22px;
    }

    h1{
      margin:0;
      font-size:38px;
      line-height:1.05;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .sub{
      margin-top:10px;
      color:var(--muted);
      font-size:18px;
      line-height:1.4;
    }

    .card{
      background:linear-gradient(180deg, rgba(34,54,83,.96), rgba(24,40,66,.96));
      border:1px solid var(--line);
      border-radius:28px;
      padding:24px;
      box-shadow:0 18px 44px rgba(0,0,0,.28);
      margin-bottom:18px;
    }

    .label{
      color:var(--muted);
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.07em;
      margin-bottom:8px;
    }

    .seance-title{
      font-size:28px;
      font-weight:900;
      line-height:1.2;
      margin-bottom:8px;
    }

    .seance-meta{
      color:var(--muted);
      font-size:17px;
      line-height:1.4;
    }

    .status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.07);
      color:var(--muted);
      line-height:1.45;
    }

    .status.ok{border-color:rgba(34,197,94,.45);color:#d9ffe8}
    .status.warn{border-color:rgba(245,180,0,.55);color:#fff4c2}
    .status.bad{border-color:rgba(239,68,68,.55);color:#ffd4d4}

    .big-buttons{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    .big-btn{
      width:100%;
      min-height:92px;
      border:0;
      border-radius:24px;
      padding:18px 20px;
      font-size:25px;
      font-weight:900;
      cursor:pointer;
      color:#06111f;
      text-align:left;
      box-shadow:0 14px 34px rgba(0,0,0,.22);
    }

    .big-btn small{
      display:block;
      margin-top:6px;
      font-size:15px;
      font-weight:700;
      opacity:.82;
      line-height:1.35;
    }

    .green{background:var(--green)}
    .yellow{background:var(--yellow)}
    .dark{
      background:#111827;
      color:white;
      border:1px solid var(--line);
    }

    .red{
      background:var(--red);
      color:white;
    }

    .choices{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:12px;
    }

    .choice{
      width:100%;
      min-height:70px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.08);
      color:white;
      padding:14px 16px;
      text-align:left;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }

    .choice small{
      display:block;
      color:var(--muted);
      margin-top:5px;
      font-size:14px;
      font-weight:600;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .mini-btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      color:white;
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }

    .hidden{display:none !important}

    @media(max-width:560px){
      .wrap{width:min(100% - 20px, 760px);padding:18px 0 28px}
      h1{font-size:30px}
      .sub{font-size:16px}
      .card{border-radius:22px;padding:18px}
      .seance-title{font-size:23px}
      .big-btn{font-size:22px;min-height:86px}
    }
  </style>
</head>

<body>
<div class="wrap">

  <header class="head">
    <h1>Вхідний контроль</h1>
    <div class="sub">
      Простий екран для контролера. Сеанс визначається автоматично.
    </div>
  </header>

  <section class="card">
    <div class="label">Поточний сеанс</div>

    <div id="currentTitle" class="seance-title">Завантаження...</div>
    <div id="currentMeta" class="seance-meta">Шукаю сьогоднішній активний сеанс.</div>

    <div id="statusBox" class="status">
      Статус: очікування даних.
    </div>

    <div class="top-actions">
      <button class="mini-btn" onclick="loadSeances()">Оновити</button>
      <button class="mini-btn" onclick="openAccessReport()">Звіт доступу</button>
      <button class="mini-btn" onclick="goBack()">← Назад</button>
    </div>
  </section>

  <section id="choicesBox" class="card hidden">
    <div class="label">Знайдено кілька сеансів</div>
    <div class="seance-meta">
      Оберіть поточний сеанс однією великою кнопкою.
    </div>
    <div id="choices" class="choices"></div>
  </section>

  <section class="card">
    <div class="big-buttons">
      <button class="big-btn green" onclick="openNormalScanner()">
        ✅ Вхід за квитком
        <small>Звичайний квиток: продаж / каса / онлайн</small>
      </button>

      <button class="big-btn yellow" onclick="openRecoveryScanner()">
        🟡 Вхід за компенсацією
        <small>Компенсаційний прохід без місця</small>
      </button>

      <button class="big-btn dark" onclick="openAccessReport()">
        📊 Контроль доступу
        <small>Перегляд проходів, явки, типів квитків і компенсацій</small>
      </button>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NORMAL_SCANNER_URL =
  "https://monks-commits.github.io/teatr-shevchenka/scanner/";
const RECOVERY_SCANNER_URL =
  "https://monks-commits.github.io/hall-engine-lab/recovery/recovery-scanner.html";
const ACCESS_REPORT_URL = "./access-control.html";

const PAGE_PARAMS = new URLSearchParams(location.search);
const TEST_MODE = PAGE_PARAMS.get("test") === "1";

let CURRENT_SEANCE = null;
let TODAY_SEANCES = [];
let CHOICE_SEANCES = [];
let ALL_SEANCES = [];

const $ = (id) => document.getElementById(id);

function localDateKey(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function seanceDateTime(s){
  const date = String(s?.date || "").trim();
  const time = String(s?.time || "00:00").slice(0,5);
  const d = new Date(`${date}T${time}:00`);
  return Number.isNaN(d.getTime()) ? null : d;
}

function seanceLabel(s){
  return {
    title: s?.show || "Без назви",
    meta: [s?.date, s?.time, s?.venue_id].filter(Boolean).join(" • ")
  };
}

function setStatus(kind, text){
  const box = $("statusBox");
  box.classList.remove("ok","warn","bad");
  if (kind) box.classList.add(kind);
  box.textContent = text || "";
}

function renderCurrent(){
  if (!CURRENT_SEANCE) {
    $("currentTitle").textContent = "Сеанс не визначено";
    $("currentMeta").textContent = TEST_MODE
      ? "Оберіть сеанс для тестування."
      : "Немає сеансу у робочому вікні входу.";
    return;
  }

  const label = seanceLabel(CURRENT_SEANCE);
  $("currentTitle").textContent = label.title;
  $("currentMeta").textContent = label.meta || CURRENT_SEANCE.id;
}

function clearStaleSelection(){
  localStorage.removeItem("va_gate_selected_seance_v1");

  const url = new URL(location.href);
  const hadSelection =
    url.searchParams.has("seance") ||
    url.searchParams.has("seance_id");

  url.searchParams.delete("seance");
  url.searchParams.delete("seance_id");

  if (hadSelection) {
    history.replaceState(null, "", url.toString());
  }
}

function chooseSeance(id){
  if (!TEST_MODE) return;

  const sid = String(id || "").trim();

  CURRENT_SEANCE =
    ALL_SEANCES.find(s => String(s.id) === sid) ||
    CHOICE_SEANCES.find(s => String(s.id) === sid) ||
    null;

  if (!CURRENT_SEANCE) {
    renderCurrent();
    setStatus("bad", "Статус: тестовий сеанс не знайдено.");
    return;
  }

  renderCurrent();
  setStatus(
    "warn",
    "ТЕСТОВИЙ РЕЖИМ: сеанс обрано лише для поточного відкриття сторінки."
  );
}

function renderChoices(list){
  const box = $("choicesBox");
  const choices = $("choices");

  CHOICE_SEANCES = Array.isArray(list) ? list : [];
  choices.innerHTML = "";

  if (!TEST_MODE || !CHOICE_SEANCES.length) {
    box.classList.add("hidden");
    return;
  }

  CHOICE_SEANCES.forEach(s => {
    const label = seanceLabel(s);
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `
      ${escapeHtml(label.title)}
      <small>${escapeHtml(label.meta || s.id)}</small>
    `;
    btn.onclick = () => chooseSeance(s.id);
    choices.appendChild(btn);
  });

  box.classList.remove("hidden");
}

function sortByDateTime(list){
  return list.slice().sort((a,b) => {
    const ad = seanceDateTime(a)?.getTime() ?? Number.MAX_SAFE_INTEGER;
    const bd = seanceDateTime(b)?.getTime() ?? Number.MAX_SAFE_INTEGER;
    return ad - bd;
  });
}

async function loadSeances(){
  CURRENT_SEANCE = null;
  TODAY_SEANCES = [];
  CHOICE_SEANCES = [];

  clearStaleSelection();

  $("currentTitle").textContent = "Завантаження...";
  $("currentMeta").textContent = "Шукаю поточний сеанс.";
  $("choicesBox").classList.add("hidden");
  setStatus("", "Статус: оновлення даних...");

  try {
    const { data, error } = await sb
      .from("seances")
      .select("id,show,date,time,venue_id,status,active,archived")
      .order("date", { ascending:true })
      .order("time", { ascending:true });

    if (error) throw error;

    const rows = Array.isArray(data) ? data : [];
    ALL_SEANCES = rows;

    const available = sortByDateTime(
      rows.filter(s => s.archived !== true && s.active !== false)
    );

    /*
      Служебный тестовый режим:
      gate-control.html?test=1

      Сеанс выбирается вручную и не сохраняется.
      Никакой старый или ближайший будущий сеанс не подставляется.
    */
    if (TEST_MODE) {
      CURRENT_SEANCE = null;
      renderCurrent();
      renderChoices(available);

      setStatus(
        available.length ? "warn" : "bad",
        available.length
          ? "ТЕСТОВИЙ РЕЖИМ: оберіть потрібний сеанс зі списку."
          : "ТЕСТОВИЙ РЕЖИМ: активних сеансів немає."
      );
      return;
    }

    /*
      Рабочий режим контролёра:
      никакого localStorage, ближайшего будущего сеанса и ручного выбора.

      Сеанс считается текущим:
      от 2 часов до начала до 4 часов после начала.
    */
    const today = localDateKey();
    const now = new Date();

    TODAY_SEANCES = available.filter(
      s => String(s.date || "") === today
    );

    const windowMatches = TODAY_SEANCES
      .map(s => {
        const dt = seanceDateTime(s);
        const diffMin = dt
          ? Math.round((dt.getTime() - now.getTime()) / 60000)
          : 999999;

        return {
          seance: s,
          diffMin,
          abs: Math.abs(diffMin)
        };
      })
      .filter(x => x.diffMin <= 120 && x.diffMin >= -240)
      .sort((a,b) => a.abs - b.abs);

    if (windowMatches.length) {
      CURRENT_SEANCE = windowMatches[0].seance;
      renderCurrent();
      setStatus("ok", "Статус: поточний сеанс визначено автоматично.");
      return;
    }

    CURRENT_SEANCE = null;
    renderCurrent();

    if (TODAY_SEANCES.length) {
      setStatus(
        "warn",
        "Статус: сьогодні є сеанси, але зараз вхід на них не відкрито."
      );
    } else {
      setStatus(
        "warn",
        "Статус: поточного сеансу немає. Сканери та звіт залишаються доступними."
      );
    }

  } catch(e) {
    console.error("loadSeances error:", e);
    $("currentTitle").textContent = "Помилка";
    $("currentMeta").textContent = String(e?.message || e);
    setStatus("bad", "Статус: помилка завантаження сеансів.");
  }
}

function currentSeanceId(){
  return CURRENT_SEANCE?.id
    ? String(CURRENT_SEANCE.id)
    : "";
}

function withSeanceUrl(baseUrl, seanceId){
  const url = new URL(baseUrl, location.href);
  url.searchParams.set("seance", seanceId);
  url.searchParams.set("seance_id", seanceId);

  if (TEST_MODE) {
    url.searchParams.set("test", "1");
  }

  return url.toString();
}

function openNormalScanner(){
  const id = currentSeanceId();

  location.href = id
    ? withSeanceUrl(NORMAL_SCANNER_URL, id)
    : new URL(NORMAL_SCANNER_URL, location.href).toString();
}

function openRecoveryScanner(){
  const id = currentSeanceId();

  location.href = id
    ? withSeanceUrl(RECOVERY_SCANNER_URL, id)
    : new URL(RECOVERY_SCANNER_URL, location.href).toString();
}

function openAccessReport(){
  const id = currentSeanceId();

  location.href = id
    ? withSeanceUrl(ACCESS_REPORT_URL, id)
    : new URL(ACCESS_REPORT_URL, location.href).toString();
}

function goBack(){
  history.back();
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

window.addEventListener("load", loadSeances);
</script>

</body>
</html>
