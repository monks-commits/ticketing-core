<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>VA • Вхідний контроль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg:#08111f;
      --card:#182842;
      --card2:#223653;
      --text:#fff;
      --muted:#b8c7dc;
      --line:rgba(255,255,255,.14);
      --green:#22c55e;
      --yellow:#f5b400;
      --red:#ef4444;
      --accent:#7f1d1d;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(127,29,29,.34), transparent 34%),
        radial-gradient(circle at top right, rgba(56,189,248,.16), transparent 30%),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      width:min(760px, calc(100% - 28px));
      margin:0 auto;
      padding:28px 0 42px;
    }

    .head{
      margin-bottom:22px;
    }

    h1{
      margin:0;
      font-size:38px;
      line-height:1.05;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .sub{
      margin-top:10px;
      color:var(--muted);
      font-size:18px;
      line-height:1.4;
    }

    .card{
      background:linear-gradient(180deg, rgba(34,54,83,.96), rgba(24,40,66,.96));
      border:1px solid var(--line);
      border-radius:28px;
      padding:24px;
      box-shadow:0 18px 44px rgba(0,0,0,.28);
      margin-bottom:18px;
    }

    .label{
      color:var(--muted);
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.07em;
      margin-bottom:8px;
    }

    .seance-title{
      font-size:28px;
      font-weight:900;
      line-height:1.2;
      margin-bottom:8px;
    }

    .seance-meta{
      color:var(--muted);
      font-size:17px;
      line-height:1.4;
    }

    .status{
      margin-top:14px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.07);
      color:var(--muted);
      line-height:1.45;
    }

    .status.ok{border-color:rgba(34,197,94,.45);color:#d9ffe8}
    .status.warn{border-color:rgba(245,180,0,.55);color:#fff4c2}
    .status.bad{border-color:rgba(239,68,68,.55);color:#ffd4d4}

    .big-buttons{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    .big-btn{
      width:100%;
      min-height:92px;
      border:0;
      border-radius:24px;
      padding:18px 20px;
      font-size:25px;
      font-weight:900;
      cursor:pointer;
      color:#06111f;
      text-align:left;
      box-shadow:0 14px 34px rgba(0,0,0,.22);
    }

    .big-btn small{
      display:block;
      margin-top:6px;
      font-size:15px;
      font-weight:700;
      opacity:.82;
      line-height:1.35;
    }

    .green{background:var(--green)}
    .yellow{background:var(--yellow)}
    .dark{
      background:#111827;
      color:white;
      border:1px solid var(--line);
    }

    .red{
      background:var(--red);
      color:white;
    }

    .choices{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:12px;
    }

    .choice{
      width:100%;
      min-height:70px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.08);
      color:white;
      padding:14px 16px;
      text-align:left;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }

    .choice small{
      display:block;
      color:var(--muted);
      margin-top:5px;
      font-size:14px;
      font-weight:600;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .mini-btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      color:white;
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }

    .hidden{display:none !important}

    @media(max-width:560px){
      .wrap{width:min(100% - 20px, 760px);padding:18px 0 28px}
      h1{font-size:30px}
      .sub{font-size:16px}
      .card{border-radius:22px;padding:18px}
      .seance-title{font-size:23px}
      .big-btn{font-size:22px;min-height:86px}
    }
  </style>
</head>

<body>
<div class="wrap">

  <header class="head">
    <h1>Вхідний контроль</h1>
    <div class="sub">
      Простий екран для контролера. Сеанс визначається автоматично.
    </div>
  </header>

  <section class="card">
    <div class="label">Поточний сеанс</div>

    <div id="currentTitle" class="seance-title">Завантаження...</div>
    <div id="currentMeta" class="seance-meta">Шукаю сьогоднішній активний сеанс.</div>

    <div id="statusBox" class="status">
      Статус: очікування даних.
    </div>

    <div class="top-actions">
      <button class="mini-btn" onclick="loadSeances()">Оновити</button>
      <button class="mini-btn" onclick="openAccessReport()">Звіт доступу</button>
      <button class="mini-btn" onclick="goBack()">← Назад</button>
    </div>
  </section>

  <section id="choicesBox" class="card hidden">
    <div class="label">Знайдено кілька сеансів</div>
    <div class="seance-meta">
      Оберіть поточний сеанс однією великою кнопкою.
    </div>
    <div id="choices" class="choices"></div>
  </section>

  <section class="card">
    <div class="big-buttons">
      <button class="big-btn green" onclick="openNormalScanner()">
        ✅ Вхід за квитком
        <small>Звичайний квиток: продаж / каса / онлайн</small>
      </button>

      <button class="big-btn yellow" onclick="openRecoveryScanner()">
        🟡 Вхід за компенсацією
        <small>Компенсаційний прохід без місця</small>
      </button>

      <button class="big-btn dark" onclick="openAccessReport()">
        📊 Контроль доступу
        <small>Перегляд проходів, явки, типів квитків і компенсацій</small>
      </button>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/*
  ВАЖНО:
  Эти два пути при необходимости меняются здесь, в одном месте.
  Обычный scanner у вас может называться иначе.
*/
const NORMAL_SCANNER_URL = "https://monks-commits.github.io/teatr-shevchenka/scanner/";
const RECOVERY_SCANNER_URL = "https://monks-commits.github.io/hall-engine-lab/recovery/recovery-scanner.html";
const ACCESS_REPORT_URL = "./access-control.html";

const GATE_SELECTED_SEANCE_KEY = "va_gate_selected_seance_v1";

let CURRENT_SEANCE = null;
let TODAY_SEANCES = [];
let CHOICE_SEANCES = [];
let ALL_SEANCES = [];

const $ = (id) => document.getElementById(id);

function localDateKey(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function seanceDateTime(s){
  const date = s.date || "";
  const time = (s.time || "00:00").slice(0,5);
  const d = new Date(`${date}T${time}:00`);

  if (Number.isNaN(d.getTime())) {
    return null;
  }

  return d;
}

function seanceLabel(s){
  const title = s.show || "Без назви";
  const date = s.date || "";
  const time = s.time || "";
  const venue = s.venue_id || "";

  return {
    title,
    meta: [date, time, venue].filter(Boolean).join(" • ")
  };
}

function setStatus(kind, text){
  const box = $("statusBox");
  box.classList.remove("ok","warn","bad");
  if (kind) box.classList.add(kind);
  box.textContent = text || "";
}

function renderCurrent(){
  if (!CURRENT_SEANCE) {
    $("currentTitle").textContent = "Сеанс не визначено";
    $("currentMeta").textContent = "Немає поточного сеансу.";
    setStatus("bad", "Статус: поточний сеанс не знайдено.");
    return;
  }

  const label = seanceLabel(CURRENT_SEANCE);

  $("currentTitle").textContent = label.title;
  $("currentMeta").textContent = label.meta || CURRENT_SEANCE.id;

  setStatus("ok", "Статус: поточний сеанс визначено автоматично.");
}

function chooseSeance(id){
  const sid = String(id || "").trim();

  CURRENT_SEANCE =
    ALL_SEANCES.find(s => String(s.id) === sid) ||
    CHOICE_SEANCES.find(s => String(s.id) === sid) ||
    TODAY_SEANCES.find(s => String(s.id) === sid) ||
    null;

  if (!CURRENT_SEANCE) {
    renderCurrent();
    setStatus("bad", "Статус: сеанс не знайдено після вибору.");
    return;
  }

  localStorage.setItem(GATE_SELECTED_SEANCE_KEY, CURRENT_SEANCE.id);

  const url = new URL(location.href);
  url.searchParams.set("seance", CURRENT_SEANCE.id);
  url.searchParams.set("seance_id", CURRENT_SEANCE.id);
  history.replaceState(null, "", url.toString());

  $("choicesBox").classList.add("hidden");

  renderCurrent();
  setStatus("ok", "Статус: сеанс обрано вручну і зафіксовано.");
}

function renderChoices(list){
  const box = $("choicesBox");
  const choices = $("choices");

  CHOICE_SEANCES = Array.isArray(list) ? list : [];

  choices.innerHTML = "";

  CHOICE_SEANCES.forEach(s => {
    const label = seanceLabel(s);

    const btn = document.createElement("button");
    btn.className = "choice";

    btn.innerHTML = `
      ${escapeHtml(label.title)}
      <small>${escapeHtml(label.meta || s.id)}</small>
    `;

    btn.onclick = () => chooseSeance(s.id);

    choices.appendChild(btn);
  });

  box.classList.remove("hidden");
}
async function loadSeances(){
  CURRENT_SEANCE = null;
  TODAY_SEANCES = [];

  $("currentTitle").textContent = "Завантаження...";
  $("currentMeta").textContent = "Шукаю поточний сеанс.";
  $("choicesBox").classList.add("hidden");
  setStatus("", "Статус: оновлення даних...");

  const qs = new URLSearchParams(location.search);
  const forcedId =
  qs.get("seance") ||
  qs.get("seance_id") ||
  localStorage.getItem(GATE_SELECTED_SEANCE_KEY) ||
  "";

  try {
    const { data, error } = await sb
      .from("seances")
      .select("id,show,date,time,venue_id,status,active,archived")
      .order("date", { ascending:true })
      .order("time", { ascending:true });

    if (error) throw error;

    const rows = Array.isArray(data) ? data : [];
ALL_SEANCES = rows;
    
    const available = rows.filter(s => {
      if (s.archived === true) return false;
      if (s.active === false) return false;
      return true;
    });

    /*
      1. Принудительный режим:
      gate-control.html?seance=ID
    */
    if (forcedId) {
      CURRENT_SEANCE =
        available.find(s => String(s.id) === String(forcedId)) ||
        rows.find(s => String(s.id) === String(forcedId)) ||
        null;

      if (CURRENT_SEANCE) {
        renderCurrent();
        setStatus("ok", "Статус: сеанс відкрито за прямим посиланням.");
        return;
      }
    }

    const today = localDateKey();
    const now = new Date();

    /*
      2. Основной рабочий режим:
      сегодняшние активные сеансы.
    */
    TODAY_SEANCES = available.filter(s => {
      if (String(s.date || "") !== today) return false;
      return true;
    });

    if (TODAY_SEANCES.length) {
      const windowMatches = TODAY_SEANCES
        .map(s => {
          const dt = seanceDateTime(s);
          const diffMin = dt
            ? Math.round((dt.getTime() - now.getTime()) / 60000)
            : 999999;

          return {
            seance:s,
            diffMin,
            abs:Math.abs(diffMin)
          };
        })
        .filter(x => {
          /*
            Сеанс считается текущим:
            от 2 часов до начала
            до 4 часов после начала.
          */
          return x.diffMin <= 120 && x.diffMin >= -240;
        })
        .sort((a,b) => a.abs - b.abs);

      if (windowMatches.length === 1) {
        CURRENT_SEANCE = windowMatches[0].seance;
        renderCurrent();
        setStatus("ok", "Статус: поточний сеанс визначено автоматично.");
        return;
      }

      if (windowMatches.length > 1) {
        renderChoices(windowMatches.map(x => x.seance));
        CURRENT_SEANCE = windowMatches[0].seance;
        renderCurrent();
        setStatus("warn", "Статус: знайдено кілька поточних сеансів. Оберіть потрібний.");
        return;
      }

      /*
        Сегодня есть сеансы, но не попали во временное окно.
      */
      renderChoices(TODAY_SEANCES);
      CURRENT_SEANCE = TODAY_SEANCES[0];
      renderCurrent();
      setStatus("warn", "Статус: сьогодні є сеанси, але поточний час не потрапив у вікно. Оберіть потрібний.");
      return;
    }

    /*
      3. Резервный / тестовый режим:
      если сегодня сеансов нет — показываем ближайшие будущие.
      Это удобно для теста, но статус будет предупреждением.
    */
    const futureSeances = available
      .map(s => {
        const dt = seanceDateTime(s);
        return {
          seance:s,
          dt
        };
      })
      .filter(x => x.dt && x.dt.getTime() >= now.getTime())
      .sort((a,b) => a.dt.getTime() - b.dt.getTime())
      .slice(0, 5)
      .map(x => x.seance);

    if (futureSeances.length === 1) {
      CURRENT_SEANCE = futureSeances[0];
      renderCurrent();
      setStatus("warn", "Статус: сьогодні сеансів немає. Обрано найближчий майбутній сеанс для тесту.");
      return;
    }

    if (futureSeances.length > 1) {
      CURRENT_SEANCE = futureSeances[0];
      renderCurrent();
      renderChoices(futureSeances);
      setStatus("warn", "Статус: сьогодні сеансів немає. Оберіть найближчий майбутній сеанс для тесту.");
      return;
    }

    /*
      4. Если будущих нет — показываем последние доступные,
      чтобы экран не был пустым при тестах.
    */
    const lastSeances = available
      .slice()
      .reverse()
      .slice(0, 5);

    if (lastSeances.length) {
      CURRENT_SEANCE = lastSeances[0];
      renderCurrent();
      renderChoices(lastSeances);
      setStatus("warn", "Статус: поточного сеансу немає. Показано останні доступні сеанси.");
      return;
    }

    renderCurrent();

  } catch(e) {
    console.error("loadSeances error:", e);

    $("currentTitle").textContent = "Помилка";
    $("currentMeta").textContent = String(e.message || e);
    setStatus("bad", "Статус: помилка завантаження сеансів.");
  }
}
function currentSeanceId(){
  if (!CURRENT_SEANCE || !CURRENT_SEANCE.id) {
    alert("Поточний сеанс не визначено.");
    return "";
  }

  return String(CURRENT_SEANCE.id);
}

function withSeanceUrl(baseUrl, seanceId){
  const url = new URL(baseUrl, location.href);
  url.searchParams.set("seance", seanceId);
  url.searchParams.set("seance_id", seanceId);
  return url.toString();
}

function openNormalScanner(){
  const id = currentSeanceId();
  if (!id) return;

  location.href = withSeanceUrl(NORMAL_SCANNER_URL, id);
}

function openRecoveryScanner(){
  const id = currentSeanceId();
  if (!id) return;

  location.href = withSeanceUrl(RECOVERY_SCANNER_URL, id);
}

function openAccessReport(){
  const id = currentSeanceId();
  if (!id) return;

  location.href = withSeanceUrl(ACCESS_REPORT_URL, id);
}

function goBack(){
  history.back();
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

window.addEventListener("load", loadSeances);
</script>

</body>
</html>
