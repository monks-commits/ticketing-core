<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"> 
<title>VA Visual Editor</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
.page{max-width:1100px;margin:0 auto;padding:28px 16px}
.card{background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;margin-bottom:18px}
h1{margin:0 0 8px}
label{display:block;margin:14px 0 6px;color:#cbd5e1;font-size:13px}
select,input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:#020617;color:#fff}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}
.btn{background:#d4af37;color:#111827;width:100%;margin-top:14px}
.btn2{background:#334155;color:#fff;width:100%;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.preview{display:grid;grid-template-columns:260px 1fr;gap:18px}
.box{background:#020617;border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;min-height:220px}
.posterBox{aspect-ratio:2/3}
.box img,.box video{width:100%;height:100%;object-fit:cover;display:block}
.small{color:#94a3b8;font-size:13px;line-height:1.4}
.status{margin-top:12px;color:#a7f3d0;font-size:14px}
@media(max-width:850px){.grid,.preview{grid-template-columns:1fr}}
.preview3{
  grid-template-columns:220px 220px 1fr;
}

.bgBox{
  min-height:330px;
}

@media(max-width:950px){
  .preview3{
    grid-template-columns:1fr;
  }
}
  
</style>
</head>

<body>
<h1>VA Visual Editor</h1>

<div class="small">
Візуальне оформлення сеансу. Афіша, Live Poster, відеофон та опис події.
</div>

  <div class="card">
    <label>Сеанс</label>
    <select id="seanceSelect">
      <option>Завантаження...</option>
    </select>

    <div class="grid">
      <div>
        <label>Афіша</label>
        <input id="posterFile" type="file" accept="image/*">
      </div>
      <div>
        <label>Live Poster mp4</label>
        <input id="livePosterFile" type="file" accept="video/mp4,video/*">
      </div>

     <div class="field">
  <label>Опис події</label>
<textarea
  id="eventText"
  rows="8"
  placeholder="Короткий опис для вітрини, схеми залу і квитка"
></textarea>
</div> 
      
      <div>
        <label>Статичний фон</label>
        <input id="bgImageFile" type="file" accept="image/*">

        <label style="display:flex;gap:10px;align-items:center;margin-top:12px">
          <input
            type="checkbox"
            id="enableBackgroundImage"
            style="width:auto">
          Використовувати статичний фон замість відеофону
        </label>
      </div>

      <div>
        <label>Відеофон</label>
        <input id="bgVideoFile" type="file" accept="video/webm,video/mp4,video/*">
        <div class="small" style="margin-top:8px">
          Відеофон використовується, коли статичний фон вимкнено.
        </div>
      </div>

      <div style="grid-column:1/-1;padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#0b1220">
        <div style="font-weight:700;margin-bottom:12px">
          Налаштування статичного фону
        </div>

        <div class="grid">
          <div>
            <label>Вписування</label>
            <select id="backgroundImageFit">
              <option value="cover">cover — заповнити екран</option>
              <option value="contain">contain — показати повністю</option>
              <option value="fill">fill — розтягнути</option>
            </select>
          </div>

          <div>
            <label>Прозорість, 0–1</label>
            <input id="backgroundImageOpacity" type="number" min="0" max="1" step="0.05" value="1">
          </div>

          <div>
            <label>Масштаб</label>
            <input id="backgroundImageScale" type="number" min="0.2" max="4" step="0.05" value="1">
          </div>

          <div>
            <label>Затемнення, 0–1</label>
            <input id="backgroundOverlayOpacity" type="number" min="0" max="1" step="0.05" value="0">
          </div>

          <div>
            <label>Зсув X, px</label>
            <input id="backgroundImageX" type="number" step="1" value="0">
          </div>

          <div>
            <label>Зсув Y, px</label>
            <input id="backgroundImageY" type="number" step="1" value="0">
          </div>
        </div>
      </div>
      <div>
        <label>Тривалість Live Poster, ms</label>
        <input id="durationInput" type="number" value="6200">

        <div style="margin-top:18px;padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#0b1220">

<div style="font-weight:700;margin-bottom:12px">
Налаштування
</div>

<label style="display:flex;gap:10px;align-items:center">
<input
type="checkbox"
id="enableLivePoster"
checked
style="width:auto">
Використовувати Live Poster
</label>

<label style="display:flex;gap:10px;align-items:center;margin-top:10px">
<input
type="checkbox"
id="showEventInfo"
checked
style="width:auto">
Показувати кнопку «Про подію»
</label>

</div>
      </div>
    </div>

    <button class="btn" id="saveBtn">Завантажити файли і зберегти</button>
    <button class="btn2" id="loadBtn">Завантажити поточний visual</button>

    <div class="status" id="status"></div>
  </div>

  <div class="card">
   <div class="preview preview3">
  <div>
    <div class="box posterBox" id="posterPreview"></div>
    <div class="small" id="posterStatus">Афіша</div>
  </div>

  <div>
    <div class="box posterBox" id="livePosterPreview"></div>
    <div class="small" id="livePosterStatus">Live Poster</div>
  </div>

  <div>
    <div class="box bgBox" id="bgPreview"></div>
    <div class="small" id="bgStatus">Відеофон</div>
  </div>
</div>

<button class="btn2" id="openSeanceBtn">Відкрити сторінку сеансу</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const seanceSelect = document.getElementById("seanceSelect");
const posterFile = document.getElementById("posterFile");
const livePosterFile = document.getElementById("livePosterFile");
const bgImageFile = document.getElementById("bgImageFile");
const bgVideoFile = document.getElementById("bgVideoFile");
const enableBackgroundImage = document.getElementById("enableBackgroundImage");
const backgroundImageFit = document.getElementById("backgroundImageFit");
const backgroundImageOpacity = document.getElementById("backgroundImageOpacity");
const backgroundImageScale = document.getElementById("backgroundImageScale");
const backgroundImageX = document.getElementById("backgroundImageX");
const backgroundImageY = document.getElementById("backgroundImageY");
const backgroundOverlayOpacity = document.getElementById("backgroundOverlayOpacity");
const durationInput = document.getElementById("durationInput");
const statusEl = document.getElementById("status");

let seances = [];
let currentVisual = null;

function setStatus(text){
  statusEl.textContent = text || "";
}

function safeName(name){
  return String(name || "file")
    .toLowerCase()
    .replace(/[^a-z0-9а-яіїєґ._-]+/gi, "-")
    .replace(/-+/g, "-");
}

async function loadSeances(){
  const { data, error } = await sb
    .from("seances")
    .select("id,show,date,time,venue_id,poster_url,active,status")
    .order("date", { ascending:true });

  if (error) {
    console.error(error);
    seanceSelect.innerHTML = `<option>Помилка завантаження</option>`;
    return;
  }

  seances = (data || []).filter(s => s.status !== "archived");

  seanceSelect.innerHTML = `<option value="">Оберіть сеанс</option>`;

  seances.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = `${s.show || "Подія"} — ${s.date || ""} ${s.time || ""} — ${s.id}`;
    seanceSelect.appendChild(opt);
  });
}

async function uploadFile(bucket, folder, file){
  if (!file) return "";

  const seanceId = seanceSelect.value;
  const ext = file.name.split(".").pop();
  const path = `${folder}/${seanceId}/${Date.now()}-${safeName(file.name)}`;

  const { error } = await sb.storage
    .from(bucket)
    .upload(path, file, {
      cacheControl:"3600",
      upsert:true
    });

  if (error) throw error;

  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

async function loadCurrentVisual(){
  const seanceId = seanceSelect.value;
  if (!seanceId) return;

  setStatus("Завантажую visual...");

  const { data, error } = await sb
    .from("seance_visuals")
    .select("*")
    .eq("seance_id", seanceId)
    .maybeSingle();

  if (error) {
    console.error(error);
    setStatus("Помилка завантаження visual");
    return;
  }

  currentVisual = data || null;

const eventTextEl = document.getElementById("eventText");

if (eventTextEl) {
  eventTextEl.value =
    currentVisual?.event_text ||
    currentVisual?.ticket_text ||
    "";
}
  
  if (currentVisual?.live_poster_duration) {
    durationInput.value = currentVisual.live_poster_duration;
  }

document.getElementById("enableLivePoster").checked =
currentVisual?.enable_live_poster ?? true;

document.getElementById("showEventInfo").checked =
currentVisual?.show_event_info ?? true;

enableBackgroundImage.checked =
  currentVisual?.background_image_enabled === true;

backgroundImageFit.value =
  currentVisual?.background_image_fit || "cover";

backgroundImageOpacity.value =
  Number(currentVisual?.background_image_opacity ?? 1);

backgroundImageScale.value =
  Number(currentVisual?.background_image_scale ?? 1);

backgroundImageX.value =
  Number(currentVisual?.background_image_x ?? 0);

backgroundImageY.value =
  Number(currentVisual?.background_image_y ?? 0);

backgroundOverlayOpacity.value =
  Number(currentVisual?.background_overlay_opacity ?? 0);

  renderPreview(currentVisual);
  setStatus(currentVisual ? "Visual завантажено" : "Для цього сеансу visual ще не створено");
}

function renderPreview(v){
  const posterBox = document.getElementById("posterPreview");
  const liveBox = document.getElementById("livePosterPreview");
  const bgBox = document.getElementById("bgPreview");

  const posterStatus = document.getElementById("posterStatus");
  const liveStatus = document.getElementById("livePosterStatus");
  const bgStatus = document.getElementById("bgStatus");

  posterBox.innerHTML = "";
  liveBox.innerHTML = "";
  bgBox.innerHTML = "";

  posterStatus.textContent = "Афіша: не завантажена";
  liveStatus.textContent = "Live Poster: не завантажено";
  bgStatus.textContent = "Фон: не завантажено";

  if (v?.poster_url) {
    posterBox.innerHTML = `<img src="${v.poster_url}" alt="">`;
    posterStatus.textContent = "Афіша: завантажена";
  }

  if (v?.live_poster_url) {
    liveBox.innerHTML = `<video src="${v.live_poster_url}" controls playsinline></video>`;
    liveStatus.textContent = "Live Poster: завантажено";
  }

  const useStaticImage =
    v?.background_image_enabled === true &&
    Boolean(v?.background_image_url);

  if (useStaticImage) {
    bgBox.innerHTML =
      `<img src="${v.background_image_url}" alt="" ` +
      `style="object-fit:${v.background_image_fit || "cover"};` +
      `opacity:${Number(v.background_image_opacity ?? 1)}">`;

    bgStatus.textContent = "Статичний фон: увімкнено";
    return;
  }

  if (v?.background_video_url) {
    bgBox.innerHTML =
      `<video src="${v.background_video_url}" controls muted loop playsinline></video>`;
    bgStatus.textContent = v?.background_image_url
      ? "Відеофон увімкнено; статичний фон збережено, але вимкнено"
      : "Відеофон: завантажено";
    return;
  }

  if (v?.background_image_url) {
    bgBox.innerHTML = `<img src="${v.background_image_url}" alt="">`;
    bgStatus.textContent = "Статичний фон завантажено, але вимкнено";
  }
}

async function saveVisual(){
  const seanceId = seanceSelect.value;
  if (!seanceId) {
    alert("Оберіть сеанс");
    return;
  }

  try {
    setStatus("Завантажую файли...");

    const posterUrl = await uploadFile("posters", "seances", posterFile.files[0]);
    const livePosterUrl = await uploadFile("video", "live-posters", livePosterFile.files[0]);
    const bgImageUrl = await uploadFile("posters", "backgrounds", bgImageFile.files[0]);
    const bgVideoUrl = await uploadFile("video", "backgrounds", bgVideoFile.files[0]);

   const payload = {
  seance_id: seanceId,
  poster_url: posterUrl || currentVisual?.poster_url || null,
  live_poster_url: livePosterUrl || currentVisual?.live_poster_url || null, 
  live_poster_duration: Number(durationInput.value || currentVisual?.live_poster_duration || 6200),
  background_video_url: bgVideoUrl || currentVisual?.background_video_url || null,

  background_image_url:
    bgImageUrl || currentVisual?.background_image_url || null,

  background_image_enabled:
    enableBackgroundImage.checked === true,

  background_image_opacity:
    Number(backgroundImageOpacity.value || 1),

  background_image_scale:
    Number(backgroundImageScale.value || 1),

  background_image_x:
    Number(backgroundImageX.value || 0),

  background_image_y:
    Number(backgroundImageY.value || 0),

  background_image_fit:
    backgroundImageFit.value || "cover",

  background_overlay_opacity:
    Number(backgroundOverlayOpacity.value || 0),

 event_text:
  document.getElementById("eventText")?.value.trim() || "",

ticket_text:
  document.getElementById("eventText")?.value.trim() || "",
  enabled: true,
  updated_at: new Date().toISOString()
};

    setStatus("Зберігаю visual...");

    const { data, error } = await sb
      .from("seance_visuals")
      .upsert(payload, { onConflict:"seance_id" })
      .select()
      .single();

   if (error) throw error;



currentVisual = data;
renderPreview(currentVisual);

setStatus("Готово. Visual і опис події збережено.");
  } catch (e) {
    console.error(e);
    setStatus("Помилка: " + (e.message || e));
  }
}

bgImageFile.addEventListener("change", () => {
  if (bgImageFile.files?.length) {
    enableBackgroundImage.checked = true;
  }
});

document.getElementById("saveBtn").addEventListener("click", saveVisual);
document.getElementById("loadBtn").addEventListener("click", loadCurrentVisual);
seanceSelect.addEventListener("change", loadCurrentVisual);

document.getElementById("openSeanceBtn").addEventListener("click", () => {
  const seanceId = seanceSelect.value;

  if (!seanceId) {
    alert("Оберіть сеанс");
    return;
  }

  window.open(
  `../site-project/pages/hall.html?seance=${encodeURIComponent(seanceId)}`,
  "_blank"
);
});
  
loadSeances();
</script>
</body>
</html>
