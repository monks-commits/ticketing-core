<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>VA • Квитковий відділ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{
      --bg:#0b0f18;
      --card:#1d2d47;
      --soft:#10233f;
      --text:#ffffff;
      --muted:#b8c4d6;
      --line:rgba(255,255,255,.12);
      --accent:#7f1d1d;
      --blue:#4c86f7;
      --green:#22c55e;
      --orange:#f59e0b;
      --red:#ef4444;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:Arial;
      background:var(--bg);
      color:var(--text);
    }

    .page{width:min(1320px,100%);margin:auto;padding:30px;}

    h1{font-size:40px;margin:0;}

    .modules{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      margin:20px 0;
    }

    .module-card{
      background:var(--card);
      padding:20px;
      border-radius:18px;
      cursor:pointer;
      border:1px solid var(--line);
    }

    .module-card.active{
      outline:2px solid var(--accent);
    }

    .workspace{
      background:var(--card);
      padding:20px;
      border-radius:18px;
      border:1px solid var(--line);
    }

    .hidden{display:none;}

    .stub-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:10px;
    }

    .stub{
      background:var(--soft);
      padding:14px;
      border-radius:14px;
    }
  </style>
</head>

<body>

<div class="page">

  <h1>Квитковий відділ</h1>

  <div class="modules">
    <div class="module-card active" onclick="show('seances')">Сеанси</div>
    <div class="module-card" onclick="show('turnover')">Оборот</div>
    <div class="module-card" onclick="show('reports')">Звіти</div>
  </div>

  <div class="workspace">

    <!-- TURNOVER -->
    <div id="turnover" class="hidden">

      <h2>Оборот квитків</h2>

      <div class="stub-grid">
        <div class="stub">Випуск: <b id="tIssued">0</b></div>
        <div class="stub">Видача: <b id="tIssuedTo">0</b></div>
        <div class="stub">Повернення: <b id="tReturns">0</b></div>
        <div class="stub">Компенсації: <b id="tComp">0</b></div>
        <div class="stub">Погашення: <b id="tUsed">0</b></div>
      </div>

    </div>

  </div>
</div>

<script>
const SUPABASE_URL="https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_nCCfptJOb8Lzy1uAwGBJzA";

function show(id){
  document.querySelectorAll('.workspace > div').forEach(d=>d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function set(id,val){
  const el=document.getElementById(id);
  if(el) el.innerText=val;
}

async function loadTurnover(seanceId){

  if(!seanceId){
    set("tIssued",0);
    set("tIssuedTo",0);
    set("tReturns",0);
    set("tComp",0);
    set("tUsed",0);
    return;
  }

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/ticket_flow?seance_id=eq.${seanceId}&select=operation_type,quantity`,
    {
      headers:{
        apikey:SUPABASE_ANON_KEY,
        Authorization:`Bearer ${SUPABASE_ANON_KEY}`
      }
    }
  );

  if(!res.ok){
    console.error(await res.text());
    return;
  }

  const rows = await res.json();

  let issued=0, returned=0, comp=0, used=0;

  rows.forEach(r=>{
    const q=Number(r.quantity||0);

    if(r.operation_type==="issue") issued+=q;
    if(r.operation_type==="return") returned+=q;
    if(r.operation_type==="compensation") comp+=q;
    if(r.operation_type==="used") used+=q;
  });

  const total = issued - returned;

  set("tIssued",issued);
  set("tIssuedTo",total);
  set("tReturns",returned);
  set("tComp",comp);
  set("tUsed",used);
}

// AUTO LOAD
window.addEventListener("load",()=>{
  const qs=new URLSearchParams(location.search);
  const sid=qs.get("seance");
  if(sid) loadTurnover(sid);
});
</script>

</body>
</html>
