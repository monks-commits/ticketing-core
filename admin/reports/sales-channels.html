<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Продажі по каналах — VA Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#061a3a;--panel:#1d2d47;--panel2:#10233f;--line:rgba(255,255,255,.10);--text:#fff;--muted:#b8c4d6;--blue:#4c86f7;--green:#22c55e;--radius:24px;--shadow:0 18px 40px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.page{width:min(1180px,calc(100% - 48px));margin:0 auto;padding:38px 0 56px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:12px;background:#fff;color:#111827;text-decoration:none;font-weight:800}.hero{margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:50px;line-height:1.05;font-weight:900}.hero p{margin:0;max-width:820px;color:var(--muted);font-size:17px;line-height:1.45}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}.card h2{margin:0 0 8px;font-size:24px}.note{color:var(--muted);font-size:14px;line-height:1.45}.filters{display:grid;grid-template-columns:170px 1fr 180px 180px;gap:14px;align-items:end;margin-top:20px}.field{display:flex;flex-direction:column;gap:6px}label{color:var(--muted);font-size:13px}select,input{width:100%;border:1px solid rgba(255,255,255,.13);background:var(--panel2);color:#fff;border-radius:14px;padding:12px;font:inherit;outline:none}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button,.btn{min-height:44px;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#08111f}.neutral{background:#334864;color:#fff}.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.kpi-card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi-label{color:var(--muted);font-size:13px;margin-bottom:8px}.kpi-value{font-size:30px;font-weight:900}.kpi-sub{color:var(--muted);font-size:13px;margin-top:6px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:#dbeafe;font-size:13px;background:rgba(255,255,255,.04)}td{font-size:15px}tr:last-child td{border-bottom:0}.num{text-align:right;white-space:nowrap}.channel-title{font-weight:900}.channel-sub{color:var(--muted);font-size:12px;margin-top:3px}.bar{height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--blue);border-radius:999px}.price-list{color:var(--muted);font-size:13px;line-height:1.45}.section-title{margin:22px 0 12px;font-size:22px}.empty{color:var(--muted);padding:26px;background:var(--panel2);border:1px solid var(--line);border-radius:18px}.small-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.day-row{display:grid;grid-template-columns:120px 1fr 110px 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.day-row:last-child{border-bottom:0}.footer-note{margin-top:14px;color:var(--muted);font-size:12px}@media(max-width:900px){.filters,.kpi,.small-grid{grid-template-columns:1fr}.page{width:min(100% - 24px,1180px);padding:24px 0 36px}.hero h1{font-size:36px}}@media print{body{background:#fff;color:#000}.topbar,.actions{display:none!important}.page{width:100%;padding:0}.card,.kpi-card,.empty{background:#fff!important;color:#000!important;box-shadow:none!important;border:1px solid #ddd!important}.note,.kpi-label,.kpi-sub,.channel-sub,.price-list,.footer-note{color:#333!important}th{background:#f3f4f6!important;color:#000!important}select,input{border:1px solid #bbb;color:#000;background:#fff}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><a class="back" href="./index.html">← Назад</a></div>
  <section class="hero"><h1>📊 Продажі по каналах</h1><p>Звіт по каналах продажів: квитки, сума, середній чек, явка та розподіл по цінах. Працює по одному сеансу або по всіх сеансах за період.</p></section>
  <section class="card">
    <h2>Параметри звіту</h2><div class="note">Оберіть період і сеанс. Для демонстрації можна залишити “Усі сеанси”.</div>
    <div class="filters">
      <div class="field"><label for="period">Період</label><select id="period" onchange="applyPeriodPreset()"><option value="today">Сьогодні</option><option value="month">Місяць</option><option value="all" selected>Увесь час</option><option value="custom">Вручну</option></select></div>
      <div class="field"><label for="seance">Сеанс</label><select id="seance"><option value="">Завантаження…</option></select></div>
      <div class="field"><label for="dateFrom">Дата від</label><input id="dateFrom" type="date" onchange="setCustomPeriod()"></div>
      <div class="field"><label for="dateTo">Дата до</label><input id="dateTo" type="date" onchange="setCustomPeriod()"></div>
    </div>
    <div class="actions"><button class="primary" onclick="run()">Сформувати</button><button class="success" onclick="window.print()">Друк</button><button class="neutral" onclick="exportCsv()">CSV</button></div>
  </section>
  <section id="out" class="card"><div class="empty">Звіт ще не сформовано.</div></section>
</div>
<script src="../../shared/config.js"></script>
<script src="../../shared/config-helper.js"></script>
<script>
const SUPABASE_URL="https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_KEY="sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";
const qs=new URLSearchParams(location.search);const URL_VENUE=qs.get("venue")||"";const URL_SEANCE=qs.get("seance")||qs.get("seance_id")||"";
let CLIENT_CONFIG=null,CONFIG_VENUES=[],LAST_ROWS=[],LAST_CHANNEL_STATS=[];
function money(n){return `${Math.round(Number(n||0)).toLocaleString("uk-UA")} грн`}function pct(part,total){return total?`${Math.round(part/total*100)}%`:"0%"}
function channelName(v){const key=String(v||"unknown").toLowerCase();const map={online:"Онлайн",site:"Онлайн",web:"Онлайн",cash:"Каса",kassa:"Каса",cashier:"Каса",partner:"Партнери",referral:"Реферали",ref:"Реферали",invite:"Запрошення",offline:"Офлайн",operator:"Оператор",compensation:"Компенсація",unknown:"Невідомо"};return map[key]||v||"Невідомо"}
function normalizeVenue(v){const found=CONFIG_VENUES.find(x=>x.id===v||x.hall===v);return found?.id||v||""}function setCustomPeriod(){document.getElementById("period").value="custom"}
function applyPeriodPreset(){const period=document.getElementById("period").value,from=document.getElementById("dateFrom"),to=document.getElementById("dateTo");if(period==="all"||period==="custom"){if(period==="all"){from.value="";to.value=""}return}const now=new Date(),yyyy=now.getFullYear(),mm=String(now.getMonth()+1).padStart(2,"0"),dd=String(now.getDate()).padStart(2,"0");if(period==="today"){const today=`${yyyy}-${mm}-${dd}`;from.value=today;to.value=today}if(period==="month"){from.value=`${yyyy}-${mm}-01`;to.value=`${yyyy}-${mm}-${dd}`}}
async function api(path){const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY},cache:"no-store"});if(!res.ok)throw new Error(await res.text()||`HTTP ${res.status}`);return await res.json()}
async function loadSeances(){const sel=document.getElementById("seance");sel.innerHTML='<option value="__all__">Усі сеанси</option>';try{CLIENT_CONFIG=await loadVAConfig();CONFIG_VENUES=Array.isArray(CLIENT_CONFIG?.venues)?CLIENT_CONFIG.venues:[]}catch(e){console.warn("config load warning",e);CONFIG_VENUES=[]}const rows=await api("seances?select=id,archived,venue_id,show,date,time&order=date.asc,time.asc");const filtered=URL_VENUE?rows.filter(s=>normalizeVenue(s.venue_id)===normalizeVenue(URL_VENUE)):rows;filtered.forEach(s=>{const opt=document.createElement("option");opt.value=s.id;opt.textContent=`${s.date||""} ${s.time||""} — ${s.show||s.id}`;sel.appendChild(opt)});if(URL_SEANCE){sel.value=URL_SEANCE;run()}}
function buildTicketQuery(){const seance=document.getElementById("seance").value,dateFrom=document.getElementById("dateFrom").value,dateTo=document.getElementById("dateTo").value;const filters=[];if(seance&&seance!=="__all__")filters.push(`seance_id=eq.${encodeURIComponent(seance)}`);if(dateFrom){const start=new Date(dateFrom+"T00:00:00").toISOString();filters.push(`created_at=gte.${encodeURIComponent(start)}`)}if(dateTo){const end=new Date(dateTo+"T23:59:59").toISOString();filters.push(`created_at=lte.${encodeURIComponent(end)}`)}return "tickets?select=id,channel,price,seance_id,created_at,checked_in_at,ticket_type,buyer_name,seat_label"+(filters.length?"&"+filters.join("&"):"")}
function groupStats(rows){const stats={};rows.forEach(t=>{const raw=t.channel||"unknown",key=String(raw||"unknown").toLowerCase(),price=Number(t.price||0),checked=!!t.checked_in_at;if(!stats[key])stats[key]={raw,title:channelName(raw),count:0,checked:0,amount:0,prices:{},ticketTypes:{}};stats[key].count++;stats[key].amount+=price;if(checked)stats[key].checked++;const pKey=String(price);if(!stats[key].prices[pKey])stats[key].prices[pKey]={count:0,amount:0};stats[key].prices[pKey].count++;stats[key].prices[pKey].amount+=price;const typeKey=t.ticket_type||"Звичайний";stats[key].ticketTypes[typeKey]=(stats[key].ticketTypes[typeKey]||0)+1});return Object.values(stats).sort((a,b)=>b.amount-a.amount||b.count-a.count)}
function groupDays(rows){const days={};rows.forEach(t=>{const d=String(t.created_at||"").slice(0,10)||"—",price=Number(t.price||0);if(!days[d])days[d]={date:d,count:0,amount:0};days[d].count++;days[d].amount+=price});return Object.values(days).sort((a,b)=>a.date.localeCompare(b.date))}
function renderPriceList(prices){return Object.entries(prices).sort((a,b)=>Number(a[0])-Number(b[0])).map(([price,p])=>`${money(price)} — ${p.count} кв. / ${money(p.amount)}`).join("<br>")}function renderTypeList(types){return Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([type,count])=>`${type}: ${count}`).join("<br>")}
async function run(){const out=document.getElementById("out");out.innerHTML='<div class="empty">Завантаження даних…</div>';try{const rows=await api(buildTicketQuery());LAST_ROWS=rows;const totalCount=rows.length,totalAmount=rows.reduce((sum,t)=>sum+Number(t.price||0),0),totalChecked=rows.filter(t=>!!t.checked_in_at).length,avg=totalCount?Math.round(totalAmount/totalCount):0;const channels=groupStats(rows);LAST_CHANNEL_STATS=channels;const channelRows=channels.map(ch=>{const share=totalCount?ch.count/totalCount*100:0,attendance=ch.count?Math.round(ch.checked/ch.count*100):0,avgCheck=ch.count?Math.round(ch.amount/ch.count):0;return `<tr><td><div class="channel-title">${ch.title}</div><div class="channel-sub">${ch.raw||"unknown"}</div><div class="bar"><div style="width:${share}%"></div></div></td><td class="num">${ch.count}</td><td class="num">${Math.round(share)}%</td><td class="num">${money(ch.amount)}</td><td class="num">${money(avgCheck)}</td><td class="num">${ch.checked}</td><td class="num">${attendance}%</td><td><div class="price-list">${renderPriceList(ch.prices)||"—"}</div></td><td><div class="price-list">${renderTypeList(ch.ticketTypes)||"—"}</div></td></tr>`}).join("");const days=groupDays(rows),maxDayCount=Math.max(1,...days.map(d=>d.count));const dayRows=days.map(d=>`<div class="day-row"><strong>${d.date}</strong><div class="bar"><div style="width:${Math.round(d.count/maxDayCount*100)}%"></div></div><div class="num">${d.count} кв.</div><div class="num">${money(d.amount)}</div></div>`).join("");out.innerHTML=`<div class="kpi"><div class="kpi-card"><div class="kpi-label">ПРОДАНО КВИТКІВ</div><div class="kpi-value">${totalCount}</div><div class="kpi-sub">у вибраному періоді</div></div><div class="kpi-card"><div class="kpi-label">ВИРУЧКА</div><div class="kpi-value">${money(totalAmount)}</div><div class="kpi-sub">сума по tickets.price</div></div><div class="kpi-card"><div class="kpi-label">СЕРЕДНІЙ ЧЕК</div><div class="kpi-value">${money(avg)}</div><div class="kpi-sub">виручка / квитки</div></div><div class="kpi-card"><div class="kpi-label">ЯВКА</div><div class="kpi-value">${pct(totalChecked,totalCount)}</div><div class="kpi-sub">${totalChecked} з ${totalCount}</div></div></div><h2>Канали продажів</h2><div class="note">Показує не тільки продаж, а й реальну явку по кожному каналу.</div>${totalCount?`<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Канал</th><th class="num">Квитків</th><th class="num">%</th><th class="num">Сума</th><th class="num">Сер. чек</th><th class="num">Відвідали</th><th class="num">Явка</th><th>Ціни</th><th>Типи</th></tr></thead><tbody>${channelRows}</tbody></table></div>`:`<div class="empty" style="margin-top:14px">Даних за вибраними параметрами немає.</div>`}<div class="small-grid"><div><h3 class="section-title">Продажі по днях</h3><div class="card" style="box-shadow:none;margin:0;background:var(--panel2)">${dayRows||`<div class="note">Даних немає.</div>`}</div></div><div><h3 class="section-title">Висновок</h3><div class="card" style="box-shadow:none;margin:0;background:var(--panel2)">${renderSummary(channels,totalCount,totalAmount,totalChecked)}</div></div></div><div class="footer-note">Джерело: public.tickets. Поля: channel, price, created_at, checked_in_at, ticket_type.</div>`}catch(e){console.error(e);out.innerHTML=`<div class="empty">Помилка формування звіту:<br>${String(e.message||e)}</div>`}}
function renderSummary(channels,totalCount,totalAmount,totalChecked){if(!totalCount)return '<div class="note">Поки немає даних для висновку.</div>';const top=channels[0];return `<p><b>Найсильніший канал:</b> ${top?.title||"—"} (${top?.count||0} кв., ${money(top?.amount||0)}).</p><p><b>Загальна явка:</b> ${pct(totalChecked,totalCount)}.</p><p><b>Каналів у звіті:</b> ${channels.length}.</p><p class="note">Для переговорів це показує не лише продажі, а й те, які канали реально приводять людей у зал.</p>`}
function exportCsv(){if(!LAST_CHANNEL_STATS.length){alert("Спочатку сформуйте звіт.");return}const lines=[["channel","tickets","amount","avg_check","checked_in","attendance_percent"].join(",")];LAST_CHANNEL_STATS.forEach(ch=>{const avg=ch.count?Math.round(ch.amount/ch.count):0,attendance=ch.count?Math.round(ch.checked/ch.count*100):0;lines.push([JSON.stringify(ch.title),ch.count,Math.round(ch.amount),avg,ch.checked,attendance].join(","))});const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sales-channels.csv";a.click();URL.revokeObjectURL(a.href)}
applyPeriodPreset();loadSeances();
</script>
</body>
</html>
