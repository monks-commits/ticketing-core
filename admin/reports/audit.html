<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Audit Log — VA Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#061a3a;
  --card:#1d2d47;
  --card-2:#223552;
  --text:#ffffff;
  --muted:#b8c4d6;
  --line:rgba(255,255,255,.10);

  --primary:#4c86f7;
  --primary-hover:#3f78e6;

  --success:#2ecc71;
  --success-hover:#28b864;

  --field:#10233f;
  --field-border:rgba(255,255,255,.12);

  --shadow:0 18px 40px rgba(0,0,0,.22);
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.page-wrap{
  width:min(1100px, calc(100% - 48px));
  margin:0 auto;
  padding:48px 0 56px;
}

.topbar{
  margin-bottom:28px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:#fff;
  color:#111827;
  font-size:16px;
  cursor:pointer;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}

.hero{
  margin-bottom:28px;
}

.hero h1{
  margin:0 0 10px;
  font-size:52px;
  line-height:1.05;
  font-weight:800;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:18px;
  line-height:1.45;
  max-width:760px;
}

.card{
  background:var(--card);
  border-radius:var(--radius-xl);
  padding:28px 24px;
  box-shadow:var(--shadow);
}

.card h2{
  margin:0 0 10px;
  font-size:24px;
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.45;
}

.row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:end;
  margin-top:22px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:220px;
}

.field--grow{
  flex:1 1 420px;
}

.field label{
  font-size:13px;
  color:var(--muted);
}

select,input{
  width:100%;
  border:1px solid var(--field-border);
  background:var(--field);
  color:#fff;
  border-radius:14px;
  padding:12px;
  outline:none;
  font:inherit;
}

select:focus,
input:focus{
  border-color:rgba(76,134,247,.6);
  box-shadow:0 0 0 3px rgba(76,134,247,.16);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:140px;
  min-height:46px;
  padding:0 18px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s ease;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary-hover);
}

.btn-success{
  background:var(--success);
  color:#08111f;
}

.btn-success:hover{
  background:var(--success-hover);
}

.result{
  margin-top:26px;
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  min-height:160px;
}

.result-empty{
  color:var(--muted);
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:16px;
}

.metric{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:18px;
}

.metric-label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:8px;
}

.metric-value{
  font-size:28px;
  font-weight:800;
  word-break:break-word;
}

@media print{
  body{
    background:#fff;
    color:#000;
  }

  .topbar,
  .actions{
    display:none;
  }

  .card,
  .result,
  .metric{
    background:#fff !important;
    color:#000 !important;
    box-shadow:none !important;
    border:1px solid #ddd !important;
  }

  select,input{
    color:#000;
    background:#fff;
    border:1px solid #ccc;
  }
}

@media (max-width:768px){
  .page-wrap{
    width:min(100% - 24px, 1100px);
    padding:24px 0 32px;
  }

  .hero h1{
    font-size:38px;
  }

  .hero p{
    font-size:16px;
  }

  .card{
    padding:20px 16px;
  }

  .field,
  .field--grow{
    min-width:100%;
    flex:1 1 100%;
  }

  .btn{
    width:100%;
  }

  .result-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="page-wrap">

  <div class="topbar">
    <a class="back-btn" href="./index.html">← Назад</a>
  </div>

  <section class="hero">
    <h1>🧾 Audit Log</h1>
    <p>
      Журнал системних дій: продажі, генерація квитків,
      зміни сеансів та службові операції.
    </p>
  </section>

  <section class="card">

    <h2>Параметри звіту</h2>

    <div class="row">

      <div class="field">
        <label for="dateFrom">Дата від</label>
        <input id="dateFrom" type="date">
      </div>

      <div class="field">
        <label for="dateTo">Дата до</label>
        <input id="dateTo" type="date">
      </div>

    </div>

    <div class="row">

      <div class="field field--grow">

        <label for="action">Дія</label>

        <select id="action">
          <option value="__all__">Усі дії</option>
          <option value="online_sale">online_sale</option>
          <option value="cash_sale">cash_sale</option>
          <option value="ticket_generated">ticket_generated</option>
        </select>

      </div>

      <div class="field field--grow">

       
        </select>

      </div>

    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="run()">
        Сформувати
      </button>

      <button class="btn btn-success" onclick="window.print()">
        Друк
      </button>
    </div>

    <div id="out" class="result">
      <div class="result-empty">
        Звіт ще не сформовано.
      </div>
    </div>

  </section>

</div>
<script src="../../shared/config.js"></script>
<script src="../../shared/config-helper.js"></script>

<script>
const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

const qs = new URLSearchParams(location.search);

const URL_VENUE =
  qs.get("venue") || "";

const URL_SEANCE =
  qs.get("seance") ||
  qs.get("seance_id") ||
  "";

function count(rows, action){
  return rows.filter(r => r.action === action).length;
}

function humanAction(action){

  const map = {

    QR_SCAN_OK:
      "🎟 Звичайний прохід",

    COMPENSATION_ENTRY_USED:
      "🟡 Компенсаційний прохід",

    COMPENSATION_ENABLED:
      "🟡 Компенсацію активовано для сеансу",

    SINGLE_COMPENSATION_ENABLED:
      "🟡 Компенсацію активовано для одного квитка",

    QR_SCAN_REPEAT:
      "⚠️ Повторний прохід",

    QR_SCAN_INVALID:
      "⛔ Недійсний QR",

    already_used:
      "⚠️ Квиток вже використано"
  };

  return map[action] || action || "Подія";
}

function renderDirectorAudit(rows){

  if (!rows.length) {

    document.getElementById("out").innerHTML = `
      <div class="result-empty">
        Подій по цьому сеансу немає.
      </div>
    `;

    return;
  }

  const scanOk =
    count(rows, "QR_SCAN_OK");

  const compUsed =
    count(rows, "COMPENSATION_ENTRY_USED");

  const compEnabled =
    count(rows, "COMPENSATION_ENABLED") +
    count(rows, "SINGLE_COMPENSATION_ENABLED");

  const repeat =
    count(rows, "QR_SCAN_REPEAT") +
    count(rows, "already_used");

  const status =
    repeat > 0
      ? "🔴 Є інциденти"
      : compUsed > 0 || compEnabled > 0
      ? "🟠 Є компенсаційні дії"
      : "🟢 Подія проходить штатно";

  const cards = `

    <div class="result-grid">

      <div class="metric">
        <div class="metric-label">
          Стан події
        </div>

        <div class="metric-value">
          ${status}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Звичайні проходи
        </div>

        <div class="metric-value">
          ${scanOk}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Компенсаційні проходи
        </div>

        <div class="metric-value">
          ${compUsed}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Компенсації активовано
        </div>

        <div class="metric-value">
          ${compEnabled}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Інциденти / повтори
        </div>

        <div class="metric-value">
          ${repeat}
        </div>
      </div>

      <div class="metric">
        <div class="metric-label">
          Усього подій
        </div>

        <div class="metric-value">
          ${rows.length}
        </div>
      </div>

    </div>
  `;

  const history = rows.map(r => `

    <div class="metric" style="margin-top:14px;">

      <div class="metric-label">
        ${new Date(r.created_at).toLocaleString()}
      </div>

      <div class="metric-value" style="font-size:20px;">
        ${humanAction(r.action)}
      </div>

      <div style="
        margin-top:8px;
        color:var(--muted);
        font-size:14px;
        line-height:1.5;
      ">
        ${r.entity_type || ""}
        ·
        ${r.source || ""}
        <br>
        ${r.entity_id || ""}
      </div>

    </div>

  `).join("");

  document.getElementById("out").innerHTML = `
    ${cards}

    <h2 style="margin-top:28px;">
      📜 Детальна історія
    </h2>

    ${history}
  `;
}

async function run(){

  const dateFrom =
    document.getElementById("dateFrom").value;

  const dateTo =
    document.getElementById("dateTo").value;

  const action =
    document.getElementById("action").value;

  

  let filters = [];

  if (dateFrom) {

    const start =
      new Date(dateFrom + "T00:00:00")
      .toISOString();

    filters.push(
      `created_at=gte.${encodeURIComponent(start)}`
    );
  }

  if (dateTo) {

    const end =
      new Date(dateTo + "T23:59:59")
      .toISOString();

    filters.push(
      `created_at=lte.${encodeURIComponent(end)}`
    );
  }

  if (action && action !== "__all__") {

    filters.push(
      `action=eq.${encodeURIComponent(action)}`
    );
  }

  

  if (URL_SEANCE) {

    filters.push(
      `seance_id=eq.${encodeURIComponent(URL_SEANCE)}`
    );
  }

  const query =
    filters.length
      ? "&" + filters.join("&")
      : "";

  const url =
    `${SUPABASE_URL}/rest/v1/audit_log?select=action,entity_type,entity_id,source,created_at&order=created_at.desc&limit=100${query}`;

  const res = await fetch(url, {
    headers:{
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    },
    cache:"no-store"
  });

  if (!res.ok) {

    alert("Помилка audit_log");

    return;
  }

  const rows =
    await res.json();

  renderDirectorAudit(rows);
}

run();
</script>

</body>
</html>
