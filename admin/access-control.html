<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>VA • Контроль доступу</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg:#0b0b0f; --card:#15151d; --card2:#1d1d27;
      --text:#f5f5f7; --muted:#9ca3af; --line:#2a2a36;
      --green:#22c55e; --red:#ef4444; --blue:#38bdf8; --accent:#7f1d1d;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#241111,#08080c 55%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{max-width:1280px;margin:0 auto;padding:22px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
    h1{margin:0 0 6px;font-size:28px;letter-spacing:.04em;text-transform:uppercase}
    h2{margin-top:0}
    .sub{color:var(--muted);font-size:14px}
    .status{padding:10px 14px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;font-size:14px;color:var(--muted)}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .card{background:linear-gradient(180deg,var(--card),#101018);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
    .metric-title{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .metric-value{font-size:34px;font-weight:800;line-height:1}
    .metric-note{margin-top:8px;color:var(--muted);font-size:13px}
    .green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}
    .main{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
    .bar{height:8px;background:#262632;border-radius:999px;overflow:hidden;margin-top:6px}
    .bar span{display:block;height:100%;background:var(--green);width:0%}
    select,button{background:#111118;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
    button{cursor:pointer;background:var(--accent);border-color:#9f1239}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .empty{color:var(--muted);padding:12px 0}
    @media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}}
    @media(max-width:560px){.grid4{grid-template-columns:1fr}.top{display:block}}
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>Контроль доступу</h1>
      <div class="sub" id="seanceInfo">Поточний сеанс завантажується...</div>
      <div class="controls">
        <select id="seanceSelect"></select>
        <button onclick="loadData()">Оновити</button>
      </div>
    </div>
    <div class="status" id="liveStatus">Статус: очікування даних</div>
  </div>

  <div class="grid4">
    <div class="card">
      <div class="metric-title">Оформлено</div>
      <div class="metric-value" id="totalExpected">0</div>
      <div class="metric-note">усі квитки по сеансу</div>
    </div>
    <div class="card">
      <div class="metric-title">Пройшло</div>
      <div class="metric-value green" id="totalPassed">0</div>
      <div class="metric-note">checked_in_at заповнено</div>
    </div>
    <div class="card">
      <div class="metric-title">Явка</div>
      <div class="metric-value blue" id="attendanceRate">0%</div>
      <div class="metric-note">пройшло / оформлено</div>
    </div>
    <div class="card">
      <div class="metric-title">Не пройшло</div>
      <div class="metric-value red" id="notPassed">0</div>
      <div class="metric-note">оформлено, але не скановано</div>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <h2>Типи квитків</h2>
      <table>
        <thead>
          <tr>
            <th>Тип</th>
            <th>Очікується</th>
            <th>Пройшло</th>
            <th>%</th>
          </tr>
        </thead>
        <tbody id="typeRows"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Канали</h2>
      <table>
        <thead>
          <tr>
            <th>Канал</th>
            <th>Очікується</th>
            <th>Пройшло</th>
            <th>%</th>
          </tr>
        </thead>
        <tbody id="channelRows"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CURRENT_SEANCE_ID = new URLSearchParams(location.search).get("seance_id") || null;

const TYPE_LABELS = {
  full: "Звичайний",
  regular: "Звичайний",
  standard: "Звичайний",
  vip: "VIP",
  discount: "Пільговий",
  child: "Дитячий",
  promo: "Акційний",
  invitation: "Запрошення",
  service: "Службовий",
  compensation: "Компенсаційний",
  free: "Безкоштовний",
  undefined: "Не вказано",
  null: "Не вказано"
};

const CHANNEL_LABELS = {
  cash: "Каса",
  online: "Онлайн",
  site: "Сайт",
  partner: "Партнер",
  operator: "Оператор",
  referral: "Реферал",
  undefined: "Не вказано",
  null: "Не вказано"
};

async function init(){
  await loadSeances();
  await loadData();
  setInterval(loadData, 5000);
}

async function loadSeances(){
  const select = document.getElementById("seanceSelect");

  const { data, error } = await sb
    .from("seances")
    .select("id,show,date,time,venue_id,status,active")
    .order("date", { ascending: true });

  if(error){
    console.error("loadSeances error:", error);
    select.innerHTML = `<option>Помилка завантаження сеансів</option>`;
    document.getElementById("seanceInfo").textContent = "Немає доступних сеансів";
    document.getElementById("liveStatus").textContent = "Статус: помилка";
    return;
  }

  select.innerHTML = "";

  const rows = data || [];

  rows.forEach(s => {
    const title = s.show || "Без назви";
    const dateTime = `${s.date || ""} ${s.time || ""}`.trim();
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = `${title} • ${dateTime}`;
    select.appendChild(opt);
  });

  if(!CURRENT_SEANCE_ID && rows.length){
    CURRENT_SEANCE_ID = rows[0].id;
  }

  if(CURRENT_SEANCE_ID){
    select.value = CURRENT_SEANCE_ID;
  }

  select.onchange = () => {
    CURRENT_SEANCE_ID = select.value;
    loadData();
  };
}

async function loadData(){
  if(!CURRENT_SEANCE_ID){
    document.getElementById("seanceInfo").textContent = "Немає доступних сеансів";
    document.getElementById("liveStatus").textContent = "Статус: немає сеансу";
    return;
  }

  document.getElementById("liveStatus").textContent = "Статус: оновлення...";

  const [seanceRes, ticketsRes] = await Promise.all([
    sb.from("seances")
      .select("id,show,date,time,venue_id,status,active")
      .eq("id", CURRENT_SEANCE_ID)
      .single(),

    sb.from("tickets")
      .select("id,seance_id,seat_label,price,channel,ticket_type,checked_in_at,checked_in_by")
      .eq("seance_id", CURRENT_SEANCE_ID)
  ]);

  if(seanceRes.error){
    console.error("seance error:", seanceRes.error);
  }

  if(ticketsRes.error){
    console.error("tickets error:", ticketsRes.error);
    document.getElementById("liveStatus").textContent = "Статус: помилка квитків";
    return;
  }

  const seance = seanceRes.data || null;
  const tickets = ticketsRes.data || [];

  renderSeance(seance);
  renderSummary(tickets);
  renderGroupedTable(tickets, "ticket_type", "typeRows", TYPE_LABELS);
  renderGroupedTable(tickets, "channel", "channelRows", CHANNEL_LABELS);

  document.getElementById("liveStatus").textContent =
    "Статус: дані оновлено " + new Date().toLocaleTimeString("uk-UA");
}

function renderSeance(seance){
  if(!seance){
    document.getElementById("seanceInfo").textContent = "Сеанс не знайдено";
    return;
  }

  const title = seance.show || "Без назви";
  const venue = seance.venue_id || "";
  const date = seance.date || "";
  const time = seance.time || "";
  const status = seance.status || "";

  document.getElementById("seanceInfo").textContent =
    `${title} • ${date} ${time} • ${venue} • ${status}`;
}

function renderSummary(tickets){
  const total = tickets.length;
  const passed = tickets.filter(t => !!t.checked_in_at).length;
  const notPassed = total - passed;
  const rate = total ? Math.round((passed / total) * 100) : 0;

  document.getElementById("totalExpected").textContent = total;
  document.getElementById("totalPassed").textContent = passed;
  document.getElementById("notPassed").textContent = notPassed;
  document.getElementById("attendanceRate").textContent = rate + "%";
}

function renderGroupedTable(tickets, field, tbodyId, labels){
  const grouped = {};

  tickets.forEach(t => {
    const raw = t[field] ?? "undefined";
    const key = String(raw).toLowerCase();
    const label = labels[key] || raw || "Не вказано";

    if(!grouped[label]){
      grouped[label] = { expected:0, passed:0 };
    }

    grouped[label].expected++;

    if(t.checked_in_at){
      grouped[label].passed++;
    }
  });

  const tbody = document.getElementById(tbodyId);
  tbody.innerHTML = "";

  const keys = Object.keys(grouped).sort();

  if(!keys.length){
    tbody.innerHTML = `
      <tr>
        <td colspan="4" class="empty">Немає даних</td>
      </tr>
    `;
    return;
  }

  keys.forEach(label => {
    const item = grouped[label];
    const percent = item.expected ? Math.round((item.passed / item.expected) * 100) : 0;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <strong>${escapeHtml(label)}</strong>
        <div class="bar"><span style="width:${percent}%"></span></div>
      </td>
      <td>${item.expected}</td>
      <td>${item.passed}</td>
      <td>${percent}%</td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

init();
</script>

</body>
</html>
