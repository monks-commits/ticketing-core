<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VA Referral</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08172b;color:#fff;font-family:Arial,sans-serif}
.box{max-width:620px;margin:24px;padding:28px;border:1px solid #334155;border-radius:18px;background:#102033;box-shadow:0 18px 50px rgba(0,0,0,.28)}
h1{margin:0 0 10px;font-size:28px}.muted{color:#b9c8dc;line-height:1.5}.err{color:#fecaca}.code{font-family:monospace;color:#93c5fd}
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Перехід до вибору місць…</h1>
  <div id="message" class="muted">VA зберігає реферальне джерело та відкриває потрібний сеанс.</div>
</div>
<script>
"use strict";

const qs = new URLSearchParams(location.search);
const refCode = String(qs.get("ref") || "").trim();
const seanceId = String(qs.get("seance_id") || qs.get("seance") || "").trim();

function fail(text){
  document.getElementById("title").textContent = "Посилання неповне";
  document.getElementById("message").innerHTML = `<span class="err">${text}</span>`;
}

if(!refCode){
  fail("Не вказано ref-код партнера.");
}else if(!/^[A-Za-z0-9._-]{2,80}$/.test(refCode)){
  fail("Некоректний ref-код партнера.");
}else if(!seanceId){
  fail("Не вказано seance_id.");
}else{
  // Session copy is useful for diagnostics and for buyer-flow pages that may
  // choose to read it. The canonical attribution remains the explicit ?ref=
  // parameter propagated through the buyer chain.
  try{
    sessionStorage.setItem("va_ref_code", refCode);
    sessionStorage.setItem("va_ref_seance_id", seanceId);
    sessionStorage.setItem("va_ref_entered_at", new Date().toISOString());
  }catch(e){}

  const target = new URL("../site-project/pages/hall.html", location.href);
  target.searchParams.set("seance", seanceId);
  target.searchParams.set("ref", refCode);

  // Preserve independent marketing attribution if the same placement belongs
  // to a VA campaign. Referral and campaign_id intentionally remain separate.
  ["campaign_id","utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(key=>{
    const value = qs.get(key);
    if(value) target.searchParams.set(key,value);
  });

  location.replace(target.toString());
}
</script>
</body>
</html>
